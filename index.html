<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<script>window.SC_APP="{{APP}}";window.SC_PREVIEW={{PREVIEW}}</script>
<!--ICONS-->
<style>
:root{--ink:#1f1b2e;--sand:#fbf6ee;--card:#fff;--brand:#c2410c;--brand2:#f59e0b;--green:#2f855a;--blue:#2b6cb0;--muted:#7a7488;--line:#eadfd0;--soft:#f4ebdd;--red:#c53030}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#2a2236;color:var(--ink);min-height:100vh;font-size:15px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:none}
h1,h2,h3{line-height:1.2}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#1b1626;color:#fff;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.top b{font-size:18px;letter-spacing:.3px}.top small{color:#b9afcf;font-size:12px}
.seg{display:flex;background:#2f2740;border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:9px;color:#cfc6e4;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--brand);color:#fff}
.sp{flex:1}
.link{color:#f0b27a;font-size:12.5px;text-decoration:underline}
#stage{display:flex;justify-content:center;padding:22px 12px}
.phone{width:410px;height:min(840px,calc(100vh - 100px));min-height:560px;background:var(--sand);border-radius:38px;box-shadow:0 0 0 10px #0e0b14,0 30px 70px #000a;overflow:hidden;position:relative}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}
.scr.fx{display:flex;flex-direction:column;overflow:hidden;padding:0}
@media(max-width:520px){#stage{padding:0}.phone{width:100vw;height:calc(100vh - 56px);border-radius:0;box-shadow:none}}
/* generic */
.pad{padding:14px 16px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}.mut{color:var(--muted);font-size:13px}.sm{font-size:12.5px}.b{font-weight:700}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--brand);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;text-align:center}
.btn.alt{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}.btn.gr{background:var(--green)}.btn.red{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn[disabled]{opacity:.5}
.btn.full{width:100%}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600;color:#5c4a33;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.badge{background:var(--brand);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:2px 7px;min-width:20px;text-align:center}
.tagb{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#e6f4ea;color:var(--green)}.tagb.o{background:#fdebd9;color:var(--brand)}.tagb.b{background:#e3eefb;color:var(--blue)}
.av{border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.vf.t-yellow{background:#eab308!important;color:#3b2f00!important}.vf.t-green{background:#16a34a!important}.vf.t-gold{background:linear-gradient(135deg,#f6d365,#c58a00)!important;color:#4a3200!important}
.vf{position:absolute;right:-3px;bottom:-3px;background:var(--blue);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;font-style:normal;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.ph{display:flex;align-items:center;gap:10px;padding:14px 12px 10px;background:var(--sand);position:sticky;top:0;z-index:5}
.ph h2{font-size:19px;flex:1}.ib{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 0 var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lh{font-size:22px;font-weight:800;padding:18px 16px 8px;display:flex;align-items:center;gap:8px}
.sec{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:14px 16px 6px}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px}.li:active{background:var(--soft)}
.sub3{display:flex;gap:6px;margin:0 16px 10px;background:var(--soft);padding:4px;border-radius:13px}
.sub3 button{flex:1;padding:8px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:#7b6747;position:relative}.sub3 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.empty{text-align:center;color:var(--muted);padding:34px 20px}.empty b{display:block;font-size:34px;margin-bottom:6px}
.err{color:var(--red);font-size:13.5px;font-weight:600}
/* nav */
.nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px 10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:5px 0;position:relative}
.nav button span{font-size:21px;filter:grayscale(1);opacity:.7}.nav button.on{color:var(--brand)}.nav button.on span{filter:none;opacity:1}
.nav .badge{position:absolute;top:0;left:56%}
/* auth */
.auth{padding:26px 24px;text-align:center;background:linear-gradient(180deg,#fff3e0,var(--sand) 40%)}
.auth .logo{font-size:56px;margin-top:10px}.auth h1{font-size:34px;color:var(--brand);letter-spacing:.5px}.auth .tag{color:var(--muted);margin:2px 0 18px;font-style:italic}
.auth form,.auth .fm{text-align:left;display:flex;flex-direction:column;gap:11px;margin-top:14px}
label.lb{font-size:12.5px;font-weight:700;color:#5c4a33;margin-bottom:-6px}
.hint{background:#fff8e1;border:1px dashed var(--brand2);border-radius:12px;padding:9px 12px;font-size:12.5px;color:#7a5200}
/* home */
.hero{padding:20px 18px 6px}.hero h1{font-size:26px}.hero p{color:var(--muted);margin-top:3px}
.ann{margin:10px 16px 0;background:linear-gradient(90deg,#1f1b2e,#44337a);color:#fff;border-radius:16px;padding:12px 14px;font-size:13.5px}.ann b{color:var(--brand2)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.wt{border-radius:22px;padding:15px;color:#fff;min-height:122px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.wt .e{font-size:30px}.wt h3{font-size:17px}.wt p{font-size:12.5px;opacity:.92}.wt .badge{position:absolute;top:12px;right:12px;background:#fff;color:var(--ink)}
.wt.off{filter:grayscale(1);opacity:.55}
.wt.wide{grid-column:span 2;min-height:0}
/* chat */
.msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#fbf6ee,#f6ecda)}

.bb{max-width:80%;padding:8px 11px 5px;border-radius:16px;font-size:14.5px;line-height:1.35;word-wrap:break-word}
.bb.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.bb.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px;box-shadow:0 1px 0 var(--line)}
.bt{font-size:10.5px;opacity:.7;text-align:right;margin-top:2px}.sn{font-size:12px;font-weight:800;margin-bottom:2px}
.vw{display:flex;align-items:center;gap:8px;min-width:190px}.vw .pl{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.them .vw .pl{background:var(--soft)}.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.7}
.pic{width:210px;height:150px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:58px;background-size:cover;background-position:center;position:relative;margin:2px 0 4px}
.pic .dur{position:absolute;right:8px;bottom:8px;background:#0008;color:#fff;font-size:11px;padding:2px 7px;border-radius:99px}
.pic .pp{position:absolute;width:44px;height:44px;border-radius:50%;background:#0007;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.fcard,.ccard,.mcard{display:flex;align-items:center;gap:10px;min-width:200px}.fi{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:20px}
.them .fi{background:var(--soft)}
.map{width:210px;height:110px;border-radius:12px;position:relative;background:#dfe9d6;background-image:linear-gradient(#cfdcc4 1px,transparent 1px),linear-gradient(90deg,#cfdcc4 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:4px;color:var(--ink)}
.callrow{display:flex;align-items:center;gap:8px;font-weight:600}
.comp{display:flex;align-items:center;gap:8px;padding:8px 10px 12px;background:#fff;border-top:1px solid var(--line)}
.comp input{border-radius:99px;padding:10px 14px}.comp .ib{background:var(--soft);box-shadow:none}.comp .send{background:var(--brand);color:#fff}
.recb{display:flex;align-items:center;gap:10px;padding:10px 12px 14px;background:#fff;border-top:1px solid var(--line)}.rd{width:12px;height:12px;border-radius:50%;background:var(--red);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
/* sheet */
.shade{position:absolute;inset:0;background:#0007;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sand);border-radius:24px 24px 0 0;padding:16px;z-index:21;max-height:82%;overflow-y:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin-bottom:12px;font-size:18px}.grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ag button{background:#fff;border-radius:16px;padding:14px 4px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 0 var(--line)}.ag span{font-size:28px}
/* feed */
.post{margin:0 16px 14px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.post .hd{display:flex;align-items:center;gap:10px;padding:12px}
.media{height:230px;display:flex;align-items:center;justify-content:center;font-size:84px;position:relative;color:#fff}
.media .dur{position:absolute;right:10px;bottom:10px;background:#0008;font-size:12px;padding:3px 9px;border-radius:99px}.media .pp{position:absolute;font-size:26px;background:#0006;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.pa{display:flex;gap:16px;padding:10px 14px;font-weight:700;font-size:14px;color:#5c4a33}.pa button{display:flex;gap:5px;align-items:center}.pa .on{color:var(--red)}
.cap{padding:0 14px 12px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}.kpi{background:#fff;border-radius:16px;padding:12px}.kpi b{font-size:22px;display:block}.kpi span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto}
.tube{margin:0 16px 14px;border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#44337a,#c2410c)}
/* wallet */
.wal{margin:6px 16px 0;border-radius:22px;padding:18px;background:linear-gradient(135deg,#1f1b2e,#2f855a);color:#fff}.wal .bal{font-size:32px;font-weight:800;margin:4px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px}.tile{background:#fff;border-radius:16px;padding:13px 4px;font-weight:700;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 1px 0 var(--line);text-align:center}.tile span{font-size:26px}
.tile.off{opacity:.4;filter:grayscale(1)}
.exc{display:flex;gap:12px;align-items:center;margin:0 16px 10px;background:#fff;border-radius:18px;padding:12px}.exc .em{width:52px;height:52px;border-radius:14px;background:var(--soft);font-size:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pb{height:9px;border-radius:9px;background:var(--soft);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:#fff}.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.done{text-decoration:line-through;opacity:.55}
.plan{border:2px solid var(--line);border-radius:18px;padding:14px;background:#fff}.plan.cur{border-color:var(--green)}.plan ul{margin:8px 0 10px 18px;font-size:13.5px;color:#5c4a33}
.sw{position:relative;display:inline-block;width:44px;height:25px;flex-shrink:0}.sw input{opacity:0;width:0;height:0;position:absolute}.sw span{position:absolute;inset:0;background:#cbbfae;border-radius:99px;transition:.2s}.sw span:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--green)}.sw input:checked+span:before{transform:translateX(19px)}
/* call */
.call{position:absolute;inset:0;z-index:40;background:linear-gradient(160deg,#1f1b2e,#3b2a5a 60%,#7b2d12);color:#fff;display:flex;flex-direction:column;padding:26px 16px 24px}
.call h2{text-align:center;font-size:20px}.call .ct{text-align:center;color:#d9cdf1;margin:4px 0 14px}
.cg{flex:1;display:grid;gap:10px;grid-template-columns:repeat(2,1fr);align-content:center;overflow:auto}
.pt{background:#ffffff14;border-radius:20px;padding:16px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px;justify-content:center}.pt.live{box-shadow:0 0 0 2px #48bb78 inset}.pt small{font-size:12px;opacity:.8}
.pt.vid{background:linear-gradient(145deg,#ffffff22,#ffffff08)}
.cc{display:flex;justify-content:center;gap:14px;padding-top:12px}.cc button{width:54px;height:54px;border-radius:50%;background:#ffffff22;font-size:22px;color:#fff}.cc .on{background:#fff;color:var(--ink)}.cc .end{background:var(--red)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f1b2e;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:99;max-width:86vw;display:none;box-shadow:0 8px 26px #0006;text-align:center}
.blk{padding:60px 28px;text-align:center}.blk b{font-size:50px;display:block}
/* admin */
#admin{width:100%;max-width:1180px;background:#f6f2ea;border-radius:20px;min-height:calc(100vh - 110px);display:grid;grid-template-columns:220px 1fr;overflow:hidden}
#admin[hidden]{display:none}
.side{background:#1b1626;color:#cfc6e4;padding:18px 12px}.side h3{color:#fff;padding:2px 10px 14px;font-size:18px}
.side button{display:flex;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;text-align:left;margin-bottom:2px;align-items:center}.side button.on{background:var(--brand);color:#fff}.side .badge{margin-left:auto}
.main{padding:22px 24px;overflow:auto}.main h2{font-size:22px;margin-bottom:4px}.main .lead{color:var(--muted);margin-bottom:16px}
.gridk{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.gk{background:#fff;border-radius:16px;padding:14px}.gk b{display:block;font-size:24px;margin:3px 0}.gk span{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.pn{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}.pn h3{font-size:15px;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px 8px}.tbl td{padding:9px 8px;border-top:1px solid var(--soft);vertical-align:middle}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.fg .fl{display:flex;align-items:center;gap:12px;background:#faf6ee;border-radius:12px;padding:11px 13px}
.ns{width:84px;padding:7px 9px;border-radius:9px}
@media(max-width:860px){#admin{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;gap:4px}.side h3{display:none}.side button{width:auto;white-space:nowrap}.two{grid-template-columns:1fr}}
/* ---- dual-mode (Normal / Business) ---- */
.phone.biz{--brand:#16a34a;--brand2:#84cc16;--soft:#e6f2e0;--line:#d5e5cd;--sand:#f3f9ef}
.phone.biz .msgs{background:linear-gradient(180deg,#f3f9ef,#e4f1dc)}
.phone.biz .auth{background:linear-gradient(180deg,#e6f6dc,var(--sand) 40%)}
.mw{margin:10px 16px 0;background:#fff;border-radius:20px;padding:8px;box-shadow:0 1px 0 var(--line)}
.mseg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.mseg button{flex:1;padding:10px 6px;border-radius:11px;font-weight:800;font-size:14px;color:#6b6250;display:flex;align-items:center;justify-content:center;gap:6px}
.mseg button.on{background:#2b6cb0;color:#fff}.mseg button.on.biz{background:#16a34a}
.mseg button.dim{opacity:.8}
.mseg small{font-weight:800;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--ink);color:#fff}
.mseg button.on small{background:#fff3}
.mcta{display:flex;align-items:center;gap:10px;padding:10px 6px 4px;font-size:13px}
.pill{display:inline-flex;gap:5px;align-items:center;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:800;background:#e3eefb;color:#2b6cb0}.pill.biz{background:#dcfce7;color:#15803d}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.n{background:#2b6cb0}.dot.b{background:#16a34a}
.nrow{display:flex;gap:12px;padding:11px 16px;align-items:flex-start}.nrow.unread{background:#fff7e8}.phone.biz .nrow.unread{background:#eefae8}
.nrow .ni{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.ban{position:absolute;left:10px;right:10px;top:12px;z-index:60;background:#1f1b2e;color:#fff;border-radius:16px;padding:11px 13px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px #0007;animation:dn .25s;cursor:pointer}
.ban.urgent{background:#b91c1c}
@keyframes dn{from{transform:translateY(-30px);opacity:0}}
.row.wrap{flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.opt:last-child{border-bottom:0}
.ordc{margin:0 16px 12px;background:#fff;border-radius:18px;padding:13px}
.bar3{height:10px;border-radius:9px;background:var(--soft);overflow:hidden;margin:5px 0 10px}.bar3 i{display:block;height:100%;background:#16a34a}
.sample{background:#fff8e1;border:1px dashed #d69e2e;border-radius:14px;padding:10px 12px;margin:0 16px 12px;font-size:13px;color:#7a5200;font-weight:600}
.lock{filter:grayscale(1);opacity:.6}

/* ---- SemaChat brand: boot spinner + opening video ---- */
.sema-spin{display:block;width:96px;height:96px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.boot::after{content:'';width:34px;height:34px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:semaspin .9s linear infinite}
@keyframes semaspin{to{transform:rotate(360deg)}}
#home{position:fixed;inset:0;z-index:100000;background:linear-gradient(160deg,#1b2a4e,#3b2a63 55%,#0f4a4a);display:flex;flex-direction:column;align-items:center;color:#fff;font-family:system-ui,sans-serif}
#home[hidden]{display:none!important}
#home .hs-top{width:100%;max-width:430px;padding:14px 22px;display:flex;justify-content:space-between;font-size:14px;font-weight:600}
#home .hs-grid{width:100%;max-width:430px;padding:30px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px 8px;justify-items:center}
#home .hs-app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;background:none;color:#fff;border:0}
#home .hs-app i{width:62px;height:62px;border-radius:15px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:28px;font-style:normal}
#home .hs-app img{width:62px;height:62px;border-radius:15px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#home .hs-app.me{animation:hspulse 1.6s ease-in-out infinite}
@keyframes hspulse{50%{transform:scale(1.07)}}
#home .hs-hint{margin-top:auto;margin-bottom:46px;font-size:13px;opacity:.8}

<main id="stage">
  <!--CLIENTONLY--><div id="splash" hidden><video id="splashv" muted playsinline preload="auto" poster="{{SPLASH_POSTER}}" src="{{SPLASH_VIDEO}}"></video><img class="sema-spin spl-fallback" alt="SemaChat" src="{{ICON192}}"><button class="spl-skip" id="splskip" type="button">Skip</button></div>

<script>(function(){var sp=document.getElementById('splash'),v=document.getElementById('splashv'),hm=document.getElementById('home');if(!sp)return;
function done(){sp.classList.add('out');setTimeout(function(){sp.hidden=true},500);try{v.pause()}catch(e){}}
function launch(){try{sessionStorage.setItem('sc_launched','1')}catch(e){}
sp.classList.remove('out','novid');sp.hidden=false;document.getElementById('splskip').onclick=done;sp.onclick=done;
v.addEventListener('ended',done);v.addEventListener('error',function(){sp.classList.add('novid');setTimeout(done,1800)});
try{v.currentTime=0}catch(e){}var p=v.play();if(p&&p.catch)p.catch(function(){sp.classList.add('novid');setTimeout(done,1800)});
setTimeout(done,11000)}
var q=location.search,force=/[?&]splash=1/.test(q),seen=false,showHome={{SHOW_HOME}};
try{seen=sessionStorage.getItem('sc_launched')==='1'}catch(e){}
if(!force&&(seen||navigator.webdriver||/[?&]nosplash/.test(q))){return}
if(showHome){hm.hidden=false;var d=new Date();document.getElementById('hsClock').textContent=d.getHours()+':'+('0'+d.getMinutes()).slice(-2);
document.getElementById('hsIcon').onclick=function(){hm.hidden=true;launch()}}else{launch()}})();
window.scHome=function(){try{sessionStorage.removeItem('sc_launched')}catch(e){}location.href=location.pathname+'?splash=1'};</script><!--/CLIENTONLY-->
<div class="phone" id="phoneWrap"><div id="app"><div class="boot"></div></div></div>
  <div id="admin" hidden></div>

<!--CORE-->
<script>
'use strict';
/* =============================== helpers & state =============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'KES '+Math.round(n).toLocaleString('en-KE');
const ago=ts=>{const s=(Date.now()-ts)/1000;if(s<60)return 'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'};
const tm=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dt=ts=>new Date(ts).toLocaleDateString([],{day:'numeric',month:'short'});
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const hsh=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h};
const ini=n=>n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=(u,s)=>{s=s||44;return `<div class="av" style="width:${s}px;height:${s}px;background:${u.color};font-size:${Math.round(s*.38)}px">${esc(ini(u.name))}${(u.tier||(u.verified?'green':(u.role==='user'?'yellow':'')))?`<i class="vf t-${u.tier||(u.verified?'green':'yellow')}">${{yellow:'!',green:'✓',gold:'★'}[u.tier||(u.verified?'green':'yellow')]}</i>`:''}</div>`};
const mem={};const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const REMOTE=typeof window.SEMACHAT_API_BASE!=='undefined';
let DB=null;
if(!REMOTE){try{DB=JSON.parse(store.get('semachat_db_v1'))}catch(e){}if(!DB||!DB.users||DB.v!==2)DB=SemaChatCore.seed()}
const DBsave=()=>{if(DB)store.set('semachat_db_v1',JSON.stringify(DB))};
const S={pf:{},mc:null,mv:null,mm:{},mx:{},idn:null,mom:null,sup:null,loan:null,guard:null,loc:null,mode:window.SC_APP==='console'?'admin':'client',token:store.get('semachat_tok')||store.get('ubuntu_tok'),atok:store.get('semachat_atok')||store.get('ubuntu_atok'),me:null,tab:'home',stack:[],d:{},cs:'contacts',ex:'business',exTag:'All',scope:'contacts',pl:'today',
  auth:{mode:'in',step:1,phone:'',code:'',name:'',email:'',role:'user',err:'',hint:''},sheet:null,call:null,rec:null,cart:[],blob:{},cat:'flights',
  adm:{section:'overview',email:'admin@semachat.app',code:'',step:1,hint:'',err:''},a:{},f:{},np:{kind:'reel',caption:'',emoji:'🎬'},w:{amt:'',to:'',method:'M-Pesa'},cm:{text:''},pt:{title:''},gp:{name:''},q:'',pick:[],blk:null,draft:'',bc:'',eb:{}};
const cur=()=>S.stack[S.stack.length-1];
Object.assign(S,{cf:'all',cmode:'auto',carch:false,wm:'auto',nf:'auto',ws:null,nu:{normal:0,business:0},notifs:null,pf:null,disc:null,prev:null,peekr:'',xf:{from:'business',amt:''},po:{amt:''},tm:{id:''},bz:{dash:null,orders:[],rev:null,team:null,settings:null,status:null},reg:{step:0,name:'',category:'',area:'',kind:'informal',taxPin:'',wl:null,welcome:null,conc:null,err:'',more:false,edit:false,touched:false}});
function setPath(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
const DEVICE='web-'+(store.get('semachat_dev')||(()=>{const d=Math.random().toString(36).slice(2,7);store.set('semachat_dev',d);return d})());
let es=null;
async function api(method,path,body,adm){
  const tok=adm?S.atok:S.token;
  if(REMOTE){
    const r=await fetch(window.SEMACHAT_API_BASE+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tok||''),'X-SemaChat-Device':DEVICE},body:body?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Request failed');e.status=r.status;e.code=j.code;throw e}return j;
  }
  await new Promise(r=>setTimeout(r,40));
  const r=SemaChatCore.handle(DB,method,path,body,tok,{'x-semachat-device':DEVICE,'x-client-ip':'preview'});DBsave();
  if(r.status>=400){const e=new Error(r.data.error);e.status=r.status;e.code=r.data.code;throw e}return r.data;
}
async function guard(fn){try{return await fn()}catch(e){if(!adminMode()&&(e.status===503||(e.status===403&&/suspended/i.test(e.message)))){S.blk=e.message;render()}else if(e.status===401&&!adminMode()&&S.token){signOut(true)}else toast(e.message)}}
const adminMode=()=>S.mode==='admin';
function connectEvents(){
  if(REMOTE){if(es)es.close();es=new EventSource('/api/stream?token='+encodeURIComponent(S.token));es.onmessage=e=>onEvent(JSON.parse(e.data))}
  else{SemaChatCore.hooks.emit=(uid,ev)=>{if(S.me&&uid===S.me.id)onEvent(ev)};SemaChatCore.hooks.persist=DBsave}
}
const prev=m=>({text:m.text,voice:'🎤 Voice message',photo:'📷 Photo',video:'🎥 Video',file:'📎 '+(m.meta&&m.meta.name),contact:'👤 Contact card',location:'📍 Location',music:'🎵 '+(m.meta&&m.meta.title),call:(m.meta&&m.meta.mode==='video'?'🎥':'📞')+' Call'}[m.type]||m.text);
const feat=k=>!S.me||S.me.features[k]!==false;

/* =============================== data loading =============================== */
/* =============================== DUAL MODE: data loading =============================== */
const isBiz=()=>!!(S.me&&S.me.activeMode==='business');
const NICON={chat:'💬',chat_biz:'💬',order:'📦',payment:'💰',review:'⭐',call:'📞',verification:'🪪',system:'📢',batch:'🗂️',ad:'📣',wallet:'👛'};
const deadline=ts=>{const m=Math.max(0,Math.round((ts-Date.now())/60000));return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'};
async function load(){
  const v=cur(),k=v?v.n:S.tab,F=m=>feat(m);
  const tryA=async(m,p)=>{try{return await api(m,p)}catch(e){return null}};
  S.me=await api('GET','/api/me');
  S.ws=await api('GET','/api/mode/widget-state');
  const nr=await tryA('GET','/api/notifications');if(nr)S.nu=nr.unread;
  if(k==='home'){if(F('planner'))S.d.planner=await tryA('GET','/api/planner')}
  else if(k==='bhome'){S.bz.dash=await api('GET','/api/biz/dashboard')}
  else if(k==='chats'||k==='chat'){if(F('chats')){
    if(k==='chats')S.d.chats=await api('GET','/api/chats?mode='+(S.cmode==='all'?'all':'auto')+(S.carch?'&archived=1':''));
    else{const all=await api('GET','/api/chats?mode=all');let ch=all.find(c=>c.id===v.id);if(!ch)ch=(await api('GET','/api/chats?mode=all&archived=1')).find(c=>c.id===v.id);
      S.d.chat={ch,msgs:await api('GET','/api/chats/'+v.id+'/messages')}}}}
  else if(k==='contacts'){S.d.contacts=await api('GET','/api/contacts');S.d.requests=await api('GET','/api/requests');
    if(S.cs==='ana'&&F('ana'))S.d.feed=await api('GET','/api/feed?scope='+S.scope)}
  else if(k==='explore'){if(F('explore'))S.d.explore=await api('GET','/api/explore?cat='+S.ex)}
  else if(k==='me'){S.disc=S.me.hasBizAccount?null:await tryA('GET','/api/mode/discovery')}
  else if(k==='wallet'){S.d.wallet=await api('GET','/api/wallet?mode='+S.wm);S.d.contacts=await api('GET','/api/contacts')}
  else if(k==='money'){S.d.wallet=await api('GET','/api/wallet?mode=business');S.bz.rev=await tryA('GET','/api/wallet/biz/revenue?days=14');S.d.contacts=await api('GET','/api/contacts')}
  else if(k==='orders'){S.bz.orders=await api('GET','/api/biz/orders')}
  else if(k==='bset'){S.bz.settings=await api('GET','/api/biz/settings');S.bz.team=await api('GET','/api/biz/team');S.d.contacts=await api('GET','/api/contacts')}
  else if(k==='notifs'){S.notifs=await api('GET','/api/notifications?mode='+S.nf);S.nu=S.notifs.unread}
  else if(k==='prefs'){S.pf=await api('GET','/api/me/preferences')}
  else if(k==='bizreg'){S.bz.status=await api('GET','/api/biz/status');if(!S.reg.welcome)S.reg.welcome=await api('GET','/api/biz/welcome');S.reg.conc=await tryA('GET','/api/biz/concierge-available');
    const b=S.bz.status.business;if(b&&S.bz.status.status==='rejected'&&!S.reg.touched)Object.assign(S.reg,{name:b.name,category:b.category,kind:b.kind,taxPin:b.taxPin||'',touched:true,step:1})}
  else if(k==='bizprev'){S.prev=await api('GET','/api/biz/preview?name='+encodeURIComponent(S.reg.name||''))}
  else if(k==='financial'){S.d.fin=await api('GET','/api/financial')}
  else if(k==='shop'){S.d.shop=await api('GET','/api/shop')}
  else if(k==='travel'){S.d.services=await api('GET','/api/services');S.d.bookings=await api('GET','/api/bookings')}
  else if(k==='plans'){S.d.plans=await api('GET','/api/plans');S.d.wallet=await api('GET','/api/wallet')}
  else if(k==='analytics'){S.d.an=await api('GET','/api/analytics')}
  else if(k==='planner'){S.d.planner=await api('GET','/api/planner')}
}
async function go(n,p){await guard(async()=>{S.stack.push(Object.assign({n},p||{}));await load();render()})}
async function back(){await guard(async()=>{S.stack.pop();await load();render()})}
async function setTab(t){await guard(async()=>{S.tab=t;S.stack=[];await load();render()})}
async function refresh(){await guard(async()=>{await load();render()})}

/* =============================== rendering: client =============================== */
function render(){adminMode()?renderAdmin():renderClient();
  $('#phoneWrap').style.display=adminMode()?'none':'';$('#admin').hidden=!adminMode();
  $('#modeNote').textContent=REMOTE?'● connected to backend':'● preview mode — data saved in this browser';$('#resetBtn').style.display=REMOTE?'none':''}
function renderClient(){
  const app=$('#app');$('#phoneWrap').classList.toggle('biz',!!(S.token&&S.me&&S.me.activeMode==='business'));const dv=$('#msgin');if(dv)S.draft=dv.value;
  if(S.blk){app.innerHTML=`<div class="blk"><b>🛠️</b><h2>${esc(S.blk)}</h2><p class="mut" style="margin:10px 0 20px">Please try again in a moment.</p><button class="btn" data-act="retry">Retry</button> <button class="btn alt" data-act="signout">Sign out</button></div>`;return}
  if(!S.token||!S.me){app.innerHTML=authView();return}
  const v=cur();const chat=v&&v.n==='chat';
  app.innerHTML=`<div class="scr ${chat?'fx':''}" id="scr">${v?pageView(v):tabView()}</div>${chat?'':nav()}${S.sheet?sheetView():''}${S.call?callView():''}${window.overlayView?overlayView():''}`;
  if(chat){const i=$('#msgin');if(i)i.value=S.draft||'';paintMsgs()}
}
function nav(){
  const t=S.tab,m=S.me,b=isBiz();
  const it=(k,e,l,bd)=>`<button class="${t===k&&!cur()?'on':''}" data-act="tab" data-t="${k}"><span>${e}</span>${l}${bd>0?`<i class="badge">${bd}</i>`:''}</button>`;
  if(b)return `<nav class="nav">${it('bhome','📊','Dashboard',0)}${it('chats','💬','Inbox',m.unread)}${it('orders','📦','Orders',0)}${it('money','💰','Revenue',0)}${it('bset','🏪','Business',0)}</nav>`;
  return `<nav class="nav">${it('home','🏠','Home',0)}${it('chats','💬','Chats',m.unread)}${it('contacts','👥','Contacts',m.requests)}${it('explore','🧭','Explore',0)}${it('me','🙋🏾','Me',0)}</nav>`;
}
function ph(title,right){return `<div class="ph"><button class="ib" data-act="back">‹</button><h2>${title}</h2>${right||''}</div>`}
function tabView(){const m={home:homeView,chats:chatsView,contacts:contactsView,explore:exploreView,me:meView,bhome:bhomeView,orders:ordersView,money:moneyView,bset:bsetView};return (m[S.tab]||(isBiz()?bhomeView:homeView))()}
function pageView(v){return ({chat:chatPage,wallet:walletPage,financial:financialPage,shop:shopPage,travel:travelPage,plans:plansPage,analytics:analyticsPage,planner:plannerPage,notifs:notifsPage,prefs:prefsPage,bizreg:bizregPage,bizprev:bizprevPage})[v.n](v)}
function offBanner(k,name){return `<div class="empty"><b>🚧</b>${name} is temporarily switched off by SemaChat.<br><span class="sm">Check back soon.</span></div>`}

/* ---- auth ---- */
function authView(){
  const a=S.auth,m=a.mode;
  const f=(l,k,t,ph)=>`<label class="lb">${l}</label><input type="${t||'text'}" data-bind="auth.${k}" value="${esc(a[k])}" placeholder="${ph||''}" ${k==='code'?'maxlength="32" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:6px;font-weight:800;font-size:20px;text-align:center"':''} ${a.step===2&&k!=='code'?'disabled':''}>`;
  let fields='';
  if(m==='up')fields=f('Full name','name','text','e.g. Amani Njoroge')+f('Email address (you will sign in with it)','email','email','you@example.com')+f('Phone number (optional)','phone','tel','0700 000 000')
    +`<label class="lb">Account type</label><select data-bind="auth.role" ${a.step===2?'disabled':''}><option value="user" ${a.role==='user'?'selected':''}>Personal</option><option value="corporate" ${a.role==='corporate'?'selected':''}>Corporate / Business</option><option value="institution" ${a.role==='institution'?'selected':''}>Institution</option></select>`;
  else fields=f('Email address','email','email','you@example.com');
  const code=a.step===2?f('Verification code from your email','code','text','ABC123')+`<div class="hint">${esc(a.hint)}</div>`:'';
  const go=a.step===1?`<button class="btn full" data-act="otp">Email me a verification code</button>`:`<button class="btn full" data-act="authgo">${m==='up'?'Verify email &amp; create my account':'Verify &amp; sign in'}</button><button class="btn alt full" data-act="authmode" data-m="${m}">Change details</button>`;
  return `<div class="scr auth"><div class="logo">🌍</div><h1>SemaChat</h1><p class="tag">I am because we are.</p>
  <div class="sub3" style="margin:0"><button class="${m==='in'?'on':''}" data-act="authmode" data-m="in">Sign in</button><button class="${m==='up'?'on':''}" data-act="authmode" data-m="up">Sign up</button></div>
  <div class="fm">${fields}${code}${a.err?`<div class="err">${esc(a.err)}</div>`:''}${go}${window.SC_PREVIEW&&m==='in'?'<button class="btn alt full" data-act="teamdemo">⚡ Development team: enter without signing in</button>':''}</div>
  <p class="mut sm" style="margin-top:16px">You sign in with your email and a 6-character code (capital letters and numbers) that SemaChat emails to you from login1@wavehub.co.ke. The code works for 5 minutes. Once in, you stay signed in, even when the app is closed or not in use, until you tap Sign out / change account.<br><b>Demo:</b> sign in as amani@mail.com with code 123ABC, or create your own account.</p></div>`;
}

/* ---- home ---- */
/* ---- shared bits ---- */
const bell=()=>{const c=S.nu?(S.nu[S.me.activeMode]||0):0;return `<button class="ib" data-act="go" data-p="notifs" style="position:relative" title="Notifications">🔔${c?`<i class="badge" style="position:absolute;top:-5px;right:-5px">${c}</i>`:''}</button>`};
const txRow=t=>`<div class="li"><div class="fi" style="background:${t.type==='in'?'#e6f4ea':'#fdebd9'}">${t.kind==='cross_mode_transfer'?'⇄':t.type==='in'?'⬇️':'⬆️'}</div><div class="grow"><b class="sm ell" style="display:block">${esc(t.title)}</b><span class="mut sm"><i class="dot ${t.mode==='business'?'b':'n'}"></i> ${t.mode==='business'?'Business':'Normal'} • ${dt(t.ts)} ${tm(t.ts)}</span></div><b style="color:${t.type==='in'?'var(--green)':'var(--ink)'}">${t.type==='in'?'+':'−'}${money(t.amount).replace('KES ','')}</b></div>`;
const orderBlock=o=>`<div style="margin-top:8px;padding:9px;background:var(--soft);border-radius:12px"><b class="sm">Order #${o.number}</b>${o.items.map(i=>`<div class="sm">• ${esc(i.name)} ×${i.qty} · ${money(i.price*i.qty)}</div>`).join('')}<div class="b" style="margin-top:4px">Total ${money(o.total)}</div>${o.status==='new'?`<div class="mut sm">⏱ ${deadline(o.deadline)} left to accept</div>`:`<span class="tagb ${o.status==='completed'?'':'o'}">${o.status}</span>`}</div>`;
function modeWidget(){
  const w=S.ws;if(!w)return '';const n=w.segments[0],b=w.segments[1],am=w.activeMode,st=w.bizState;
  const seg=(s,cls,dot)=>`<button class="${am===s.id?'on '+cls:''} ${s.enabled?'':'dim'}" data-act="msw" data-v="${s.id}">${dot} ${s.label}${s.enabled?(s.badgeCount?`<small>${s.badgeCount}</small>`:''):`<small>${esc(s.ctaLabel||'Register')}</small>`}</button>`;
  let cta='';
  if(st.status!=='active'){
    const map={register:['🚀','Grow your business on SemaChat'],continue_registration:['⏳','Your business is awaiting verification'],view_status:['⚠️','Your business account is suspended'],reactivate:['♻️','Your archived business can be restored']};
    const m=st.status==='rejected'?['❌','Verification was not approved']:(map[st.ctaAction]||map.register);
    cta=`<div class="mcta"><span style="font-size:20px">${m[0]}</span><div class="grow">${m[1]}${st.rejectReason?`<div class="err sm">${esc(st.rejectReason)}</div>`:''}</div><button class="btn sm" data-act="bizcta" data-v="${st.ctaAction}">${esc(st.ctaLabel||'Register')}</button></div>`;
  }
  return `<div class="mw"><div class="mseg">${seg(n,'','🔵')}${seg(b,'biz','🟢')}</div>${cta}</div>`;
}

/* ---- home (normal) ---- */
function homeView(){
  const m=S.me,pl=S.d.planner,tasks=pl?pl.tasks.filter(t=>!t.done).slice(0,3):[];
  const hr=new Date().getHours(),g=hr<12?'Habari za asubuhi':hr<18?'Habari za mchana':'Habari za jioni';
  const W=(k,bg,e,t,p,badge,feature)=>`<button class="wt ${feat(feature)?'':'off'}" style="background:${bg}" data-act="${feat(feature)?'tab':'off'}" data-t="${k}">${badge>0?`<i class="badge">${badge}</i>`:''}<span class="e">${e}</span><div><h3>${t}</h3><p>${p}</p></div></button>`;
  return `<div class="hero row"><div class="grow"><h1>${g}, ${esc(m.name.split(' ')[0])} 👋🏾</h1><p>${new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}</p></div>${bell()}</div>
  ${m.announcement?`<div class="ann"><b>📢 From SemaChat:</b> ${esc(m.announcement.text)}</div>`:''}
  ${modeWidget()}
  <div class="wg">${W('chats','linear-gradient(135deg,#c2410c,#f59e0b)','💬','Chats','Text, voice, calls, groups',m.unread,'chats')}
  ${W('contacts','linear-gradient(135deg,#6b46c1,#b83280)','👥','Contacts & AnA','Friends, reels & your Tube',m.requests,'chats')}
  ${W('explore','linear-gradient(135deg,#2b6cb0,#0f766e)','🧭','Explore','Business & entertainment',0,'explore')}
  ${W('me','linear-gradient(135deg,#2f855a,#1f1b2e)','🙋🏾','Me',money(m.balance)+' in wallet',0,'wallet')}
  <button class="wt wide ${feat('planner')?'':'off'}" style="background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line)" data-act="${feat('planner')?'openplanner':'off'}"><div class="row" style="justify-content:space-between;width:100%"><h3>📅 My Life Planner</h3><span class="mut sm">Open ›</span></div>
   <div class="col" style="gap:7px;margin-top:6px;width:100%">${tasks.length?tasks.map(t=>`<div class="row"><span class="chk">○</span><span class="grow ell">${esc(t.title)}</span><span class="mut sm">${esc(t.when)}</span></div>`).join(''):'<span class="mut">Nothing pending. Enjoy your day ✨</span>'}</div></button></div>`;
}

/* ---- chats ---- */
function chatSub(ch){
  if(ch.type==='group')return ch.members.length+' members'+(ch.isCrossMode?' • 🌐 both modes':'');
  if(ch.other&&ch.other.phoneHidden)return '📵 Customer · phone hidden until first order';
  if(ch.ai)return '🤖 Works in both modes';
  return ch.isBizChat?(ch.modeContext==='business'?'🏪 Customer chat':'🏪 Business chat'):'';
}
function chatsView(){
  if(!feat('chats'))return offBanner('chats','Chats');
  const list=S.d.chats||[],f=S.cf||'all',biz=isBiz();
  const shown=list.filter(c=>f==='all'||(f==='direct'&&c.type==='direct')||(f==='group'&&c.type==='group'));
  const tag=c=>(c.isCrossMode?'<span class="tagb b">🌐 Both modes</span> ':'')+(S.cmode==='all'&&!c.isCrossMode?`<span class="tagb ${c.modeContext==='business'?'':'b'}">${c.modeContext==='business'?'Business':'Normal'}</span> `:'');
  return `<div class="lh">${biz?'Business inbox':'Chats'}<span style="flex:1"></span>${biz?'':`<button class="ib" data-act="newgroup" title="New group">👥</button><button class="ib" data-act="conf" title="Conference call">📞</button>`}${bell()}</div>
  <div class="chips" style="padding-left:16px">${['all','direct','group'].map(x=>`<button class="chip ${f===x?'on':''}" data-act="qf" data-v="${x}">${{all:'All',direct:'Direct',group:'Groups'}[x]}</button>`).join('')}<button class="chip ${S.cmode==='all'?'on':''}" data-act="cmode">🔀 All modes</button><button class="chip ${S.carch?'on':''}" data-act="carch">🗄️ Archived</button></div>
  ${shown.length?shown.map(c=>`<div class="li" data-act="openchat" data-id="${c.id}">${c.other?av(c.other,50):`<div class="av" style="width:50px;height:50px;background:${c.color};font-size:22px">👥</div>`}
   <div class="grow"><div class="row"><b class="grow ell">${esc(c.name)}</b><span class="mut sm">${c.last?ago(c.last.ts):''}</span></div>
   <div class="row"><span class="mut ell grow">${tag(c)}${c.last?(c.last.from===S.me.id?'You: ':'')+esc(prev(c.last)):'No messages yet'}</span>${c.unread?`<i class="badge">${c.unread}</i>`:''}</div></div></div>`).join(''):`<div class="empty"><b>${S.carch?'🗄️':'💬'}</b>${S.carch?'No archived chats.':biz?'No customer chats yet. Use the demo tools on the Dashboard.':'No chats yet. Start from Contacts.'}</div>`}`;
}

/* ---- wallet ---- */
function walletPage(){
  const w=S.d.wallet;if(!w)return ph('Wallet');
  const modes=[['auto','This mode'],['normal','Normal']].concat(S.me.hasBizAccount?[['business','Business']]:[]).concat([['all','All']]);
  return ph('Wallet')+`<div class="wal"><div class="sm" style="opacity:.8">Available balance · same in both modes</div><div class="bal">${money(w.balance)}</div><div class="row wrap"><button class="btn sm" style="background:#fff;color:var(--ink)" data-act="topup">＋ Top up</button><button class="btn sm" style="background:#ffffff33" data-act="sendmoney">➤ Send</button>${S.me.isBizOwner?`<button class="btn sm" style="background:#ffffff33" data-act="xfer">⇄ Move between modes</button>`:''}</div></div>
  <div class="chips" style="padding-top:12px">${modes.map(x=>`<button class="chip ${S.wm===x[0]?'on':''}" data-act="wm" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div class="sec">Transactions • ${w.mode==='all'?'all modes':w.mode}</div>${w.tx.map(txRow).join('')||'<div class="empty">No transactions in this view.</div>'}`;
}

  const w=S.d.wallet,r=S.bz.rev;if(!w)return '<div class="empty">Loading…</div>';

  return `<div class="lh">Revenue</div><div class="wal"><div class="sm" style="opacity:.8">Wallet balance · same as in Normal mode</div><div class="bal">${money(w.balance)}</div><div class="row wrap"><button class="btn sm" style="background:#fff;color:var(--ink)" data-act="topup">＋ Top up</button>${own?`<button class="btn sm" style="background:#ffffff33" data-act="xfer">⇄ Owner draw / capital</button><button class="btn sm" style="background:#ffffff33" data-act="payout">🏦 Payout</button>`:''}</div></div>
  ${r?`<div class="kpis" style="margin-top:12px"><div class="kpi"><b>${money(r.revenue).replace('KES ','')}</b><span>Revenue, 14 days (KES)</span></div><div class="kpi"><b>${r.orders}</b><span>Paid orders</span></div><div class="kpi"><b>${money(r.avgOrder).replace('KES ','')}</b><span>Average order (KES)</span></div><div class="kpi"><b>${money(r.taxCollected).replace('KES ','')}</b><span>VAT collected (KES)</span></div></div>
  <div class="card" style="margin:12px 16px"><b>Daily revenue</b>${bars(r.series.map(x=>x.revenue),{h:80,labels:r.series.map(x=>x.date.slice(8)),fmt:money,color:'#16a34a'})}<div class="mut sm" style="margin-top:4px">Refunds ${money(r.refunds)} · Ad spend ${money(r.adSpend)} · Payouts ${money(r.payouts)}</div></div>
  <div class="row" style="padding:0 16px 8px;flex-wrap:wrap"><span class="chip">Payout: ${esc(r.payoutSchedule)}</span><span class="chip">${r.bankLinked?'🏦 Bank linked':'No bank linked'}</span><button class="btn sm alt" data-act="exportcsv">⬇ Export CSV</button></div>`:`<div class="sample" style="margin-top:12px">Only the business owner sees revenue analytics. Team members see the business ledger below.</div>`}
  <div class="sec">Business ledger</div>${w.tx.map(txRow).join('')||'<div class="empty">No business transactions yet.</div>'}`;

/* ---- orders ---- */
function ordersView(){
  const l=S.bz.orders||[];
  return `<div class="lh">Orders<span style="flex:1"></span>${bell()}</div>`+(l.length?l.map(o=>`<div class="ordc"><div class="row"><b class="grow">#${o.number} · ${esc(o.customer.name)}</b><span class="tagb ${o.status==='new'?'o':o.status==='completed'?'':'b'}">${o.status}</span></div><div class="mut sm" style="margin:4px 0">${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</div><div class="row wrap"><b class="grow">${money(o.total)}</b>${o.status==='new'?`<span class="mut sm">⏱ ${deadline(o.deadline)}</span><button class="btn sm" data-act="ordok" data-id="${o.id}">Accept</button><button class="btn sm alt" data-act="ordno" data-id="${o.id}">Reject</button>`:o.status==='completed'?`<button class="btn sm alt" data-act="invoice" data-id="${o.id}">🧾 Invoice</button>`:''}</div></div>`).join(''):'<div class="empty"><b>📦</b>No orders yet. Simulate one from the Dashboard.</div>');

/* ---- notifications, prefs ---- */
function notifsPage(){
  const d=S.notifs;if(!d)return ph('Notifications');
  const other=S.nu?(S.nu[S.me.activeMode==='business'?'normal':'business']||0):0;
  return ph('Notifications',`<button class="chip" data-act="markread">Mark all read</button>`)+`<div class="chips"><button class="chip ${S.nf==='auto'?'on':''}" data-act="nf" data-v="auto">${isBiz()?'🟢 Business':'🔵 Normal'}</button><button class="chip ${S.nf==='all'?'on':''}" data-act="nf" data-v="all">All modes${other?` · ${other} in ${isBiz()?'Normal':'Business'}`:''}</button></div>`
   +(d.items.map(n=>`<div class="nrow ${n.read?'':'unread'}" data-act="opennotif" data-id="${n.id}" data-b="${n.isBatch?1:0}"><div class="ni" style="background:${n.mode==='business'?'#dcfce7':'#e3eefb'}">${NICON[n.type]||'🔔'}</div><div class="grow"><div class="row"><b class="grow sm">${esc(n.title)}</b><span class="mut sm">${ago(n.ts)}</span></div><div class="sm ${n.read?'mut':''}">${esc(n.body)}</div><div class="mut sm"><i class="dot ${n.mode==='business'?'b':'n'}"></i> ${n.mode==='business'?'Business':'Normal'}${n.urgent?' · ⚡ critical':''}${n.isBatch?' · '+n.count+' updates':''}</div></div></div>`).join('')||'<div class="empty"><b>🔔</b>You are all caught up.</div>');
}
function prefsPage(){
  const p=S.pf;if(!p)return ph('Settings');
  const sw=(k,on)=>`<label class="sw"><input type="checkbox" data-act="pfset" data-k="${k}" ${on?'checked':''}><span></span></label>`;
  const as=p.autoSwitch===true?'true':p.autoSwitch===false?'false':'critical_only';
  const dnd=(m,l)=>{const d=p.dnd[m];return `<div class="card" style="margin:0 16px 10px"><div class="row"><b class="grow">${l} quiet hours</b>${sw('dnd.'+m+'.enabled',d.enabled)}</div><div class="row" style="margin-top:8px"><input type="time" data-onchg="pfsel" data-k="dnd.${m}.start" value="${d.start}"><span class="mut">to</span><input type="time" data-onchg="pfsel" data-k="dnd.${m}.end" value="${d.end}"></div><div class="row" style="margin-top:8px"><span class="grow sm">Critical alerts still ring</span>${sw('dnd.'+m+'.critical',d.critical!==false)}</div></div>`};
  return ph('Mode & notifications')+`<div class="sec">Tapping a notification from the other mode</div><div style="padding:0 16px"><select data-onchg="pfsel" data-k="autoSwitch"><option value="critical_only" ${as==='critical_only'?'selected':''}>Switch mode only for critical alerts (recommended)</option><option value="true" ${as==='true'?'selected':''}>Always switch mode</option><option value="false" ${as==='false'?'selected':''}>Always peek first, never switch</option></select><div class="mut sm" style="margin-top:6px">Critical: calls, orders over KES 5,000, 1–2★ reviews, failed payments, verification changes.</div></div>
  <div class="sec">Silent alerts</div><div style="padding:0 16px"><div class="opt"><div class="grow"><b class="sm">Business alerts while in Normal mode</b><div class="mut sm">Badge only, no sound or banner</div></div>${sw('silentBizInNormal',p.silentBizInNormal)}</div><div class="opt"><div class="grow"><b class="sm">Normal alerts while in Business mode</b><div class="mut sm">Badge only, no sound or banner</div></div>${sw('silentNormalInBiz',p.silentNormalInBiz)}</div></div>
  <div class="sec">Quiet hours per mode</div>${dnd('normal','Normal')}${dnd('business','Business')}`;
}

/* ---- business registration + sample dashboard ---- */
const BCATS=[['pharmacy','Pharmacy'],['cafe','Café & coffee'],['restaurant','Restaurant'],['retail','Retail shop'],['salon','Salon & beauty'],['electronics','Electronics'],['design','Design & services'],['wellness','Health & wellness']];
const BAREAS=[['westlands','Westlands'],['parklands','Parklands'],['cbd','Nairobi CBD'],['nanyuki','Nanyuki'],['kisumu','Kisumu']];
function bizregPage(){
  const r=S.reg,st=S.bz.status;if(!st||!r.welcome)return ph('Business');
  const w=r.welcome;let body='';
  if(st.status==='active')body=`<div class="empty"><b>✅</b>Your business <b>${esc(st.business.name)}</b> is active.</div><div style="padding:0 16px"><button class="btn full" data-act="msw" data-v="business">Switch to Business mode</button></div>`;
  else if(st.status==='pending'&&!r.edit)body=`<div class="empty"><b>⏳</b><h3>Under review</h3><p class="mut" style="margin:6px 0">We are verifying <b>${esc(st.business.name)}</b>. This usually takes under a day. You can keep using SemaChat normally in the meantime.</p></div><div class="sample">Demo: open the Developer Console → Businesses to approve it, then come back and tap Business.</div><div class="col" style="padding:0 16px"><button class="btn alt full" data-act="regedit">Edit my details</button></div>`;
  else if(st.status==='suspended')body=`<div class="empty"><b>⚠️</b><h3>Account suspended</h3><p class="mut">Contact support at help@semachat.app for next steps.</p></div>`;
  else if(r.step===0)body=`<div class="pad"><h2>${esc(w.headline)}</h2><div class="sec" style="padding-left:0">Why Business mode</div><ul style="margin-left:18px;line-height:1.6">${w.benefits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${r.more?`<div class="sec" style="padding-left:0">What you need</div><ul style="margin-left:18px;line-height:1.6">${w.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>
   ${r.conc&&r.conc.available?`<div class="card" style="margin:0 16px 10px"><b>📞 Free setup call</b><div class="mut sm">You are among the first 100 businesses (${r.conc.slotsUsed}/${r.conc.slotsTotal} slots used).</div><button class="btn sm alt" style="margin-top:6px" data-act="concbook">Book a setup call</button></div>`:''}
   <div class="col" style="padding:0 16px"><button class="btn full" data-act="regstart">${esc(w.ctaButtons[0].label)}</button><button class="btn alt full" data-act="reglearn">${esc(w.ctaButtons[1].label)}</button><button class="btn alt full" data-act="go" data-p="bizprev">👀 See a sample dashboard</button><button class="chip" style="align-self:center" data-act="back">${esc(w.ctaButtons[2].label)}</button></div>`;
  else{const wl=r.wl;
    body=`<div class="pad col">${st.status==='rejected'?`<div class="err">Previous submission: ${esc(st.rejectReason||'not approved')}. Please fix and resubmit.</div>`:''}
    <label class="lb">Business name</label><input data-bind="reg.name" value="${esc(r.name)}" placeholder="e.g. Amani Pharmacy">
    <label class="lb">Category</label><select data-bind="reg.category" data-onchg="chkwait"><option value="">Choose…</option>${BCATS.map(c=>`<option value="${c[0]}" ${r.category===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
    <label class="lb">Area</label><select data-bind="reg.area" data-onchg="chkwait"><option value="">Choose…</option>${BAREAS.map(c=>`<option value="${c[0]}" ${r.area===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
    ${wl&&wl.isSaturated?`<div class="card" style="border:1.5px solid #d69e2e"><b>⚠️ ${esc(wl.category)} is crowded in ${esc(wl.area)}</b><div class="mut sm">${wl.businessesWithin2km} businesses within 2 km. Pick an option:</div>${wl.alternativeActions.map(a=>`<button class="btn sm alt" style="margin-top:6px;display:block;width:100%" data-act="wlalt" data-v="${a.type}">${esc(a.label)}</button>`).join('')}</div>`:(wl?`<div class="hint" style="background:#e6f4ea;border-color:#38a169;color:#276749">✅ Room for another ${esc(wl.category)} in ${esc(wl.area)}.</div>`:'')}
    <label class="lb">Business type</label><div class="row"><button class="chip ${r.kind==='informal'?'on':''}" data-act="regkind" data-v="informal">Informal / individual</button><button class="chip ${r.kind==='formal'?'on':''}" data-act="regkind" data-v="formal">Registered company</button></div>
    ${r.kind==='formal'?`<label class="lb">Tax PIN</label><input data-bind="reg.taxPin" value="${esc(r.taxPin)}" placeholder="P051234567X">`:''}
    ${r.err?`<div class="err">${esc(r.err)}</div>`:''}<button class="btn full" data-act="doreg">${st.status==='rejected'?'Resubmit for verification':'Submit for verification'}</button></div>`;}
  return ph('SemaChat for Business')+body;
}

  const mine=m.from===S.me.id,s=ch.members.find(x=>x.id===m.from)||{name:'?',color:'#888'},mt=m.meta||{};let b='';
  switch(m.type){

    case 'photo':b=`<div class="pic" style="background-image:${mt.thumb?`url(${mt.thumb})`:`linear-gradient(135deg,${(mt.g||['#ed8936','#744210']).join(',')})`}">${mt.thumb?'':esc(mt.emoji||'🖼️')}</div>${m.text?esc(m.text):''}`;break;
    case 'video':b=S.blob[m.id]?`<video src="${S.blob[m.id]}" controls style="width:210px;border-radius:12px"></video>`:`<div class="pic" style="background-image:linear-gradient(135deg,#44337a,#1a202c)">🎞️<span class="pp">▶</span><span class="dur">${mmss(mt.dur||0)}</span></div>`;break;
    case 'file':b=`<div class="fcard"><div class="fi">📄</div><div class="grow"><b class="sm">${esc(mt.name)}</b><div class="sm" style="opacity:.75">${esc(mt.size||'')}</div></div></div>`;break;
    case 'contact':b=`<div class="ccard"><div class="fi">👤</div><div class="grow"><b class="sm">${esc(mt.name)}</b><div class="sm" style="opacity:.8">${esc(mt.phone)}</div></div><button class="chip" data-act="savecontact">Save</button></div>`;break;
    case 'location':b=`<div class="map">📍</div><b class="sm">${esc(mt.label||'Pinned location')}</b><div class="sm" style="opacity:.75">${mt.lat}, ${mt.lng} • <a style="color:inherit" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${mt.lat}&mlon=${mt.lng}#map=15/${mt.lat}/${mt.lng}">Open map</a></div>`;break;
    case 'music':b=`<div class="mcard"><div class="fi">🎵</div><div class="grow"><b class="sm">${esc(mt.title)}</b><div class="sm" style="opacity:.8">${esc(mt.artist)} • ${mmss(mt.dur||0)}</div></div><span class="pl chip" data-act="playm">▶</span></div>`;break;

  }
  return `<div class="bb ${mine?'me':'them'}">${!mine&&ch.type==='group'?`<div class="sn" style="color:${s.color}">${esc(s.name)}</div>`:''}${b}<div class="bt">${tm(m.ts)}</div></div>`;

    (p.tasks.map(x=>`<div class="li"><span class="chk ${x.done?'on':''}" data-act="tasktg" data-id="${x.id}">${x.done?'✓':''}</span><div class="grow ${x.done?'done':''}"><b class="sm">${esc(x.title)}</b><div class="mut sm">${esc(x.when)} • ${esc(x.tag)}</div></div><button class="mut" data-act="taskdel" data-id="${x.id}">✕</button></div>`).join('')||'<div class="empty"><b>✨</b>All clear.</div>')
    :t==='goals'?`<div class="row" style="padding:0 16px 10px"><input data-bind="pt.title" placeholder="New goal…" value="${esc(S.pt.title)}"><button class="btn sm" data-act="addgoal">Add</button></div>`+p.goals.map(g=>`<div class="exc"><div class="em">${g.emoji}</div><div class="grow"><b class="sm">${esc(g.title)}</b><div class="pb" style="margin:7px 0 3px"><i style="width:${g.progress}%"></i></div><span class="mut sm">${g.progress}% complete</span></div><button class="btn sm alt" data-act="goalup" data-id="${g.id}">+10%</button></div>`).join('')
    :`<div class="row" style="padding:0 16px 10px"><input data-bind="pt.title" placeholder="New habit…" value="${esc(S.pt.title)}"><button class="btn sm" data-act="addhabit">Add</button></div>`+p.habits.map(h=>{const dn=h.last===new Date().toDateString();return `<div class="exc"><div class="em">${h.emoji}</div><div class="grow"><b class="sm">${esc(h.title)}</b><div class="mut sm">🔥 ${h.streak}-day streak</div></div><span class="chk ${dn?'on':''}" data-act="habitck" data-id="${h.id}">${dn?'✓':''}</span></div>`}).join('');
  return ph('Life Planner')+`<div class="sub3"><button class="${t==='today'?'on':''}" data-act="pl" data-v="today">Tasks</button><button class="${t==='goals'?'on':''}" data-act="pl" data-v="goals">Goals</button><button class="${t==='habits'?'on':''}" data-act="pl" data-v="habits">Habits</button></div>${body}`;
}

/* ---- call overlay ---- */
function partsHtml(){const c=S.call,now=Date.now();
  const me=`<div class="pt ${c.mode==='video'&&c.cam?'vid':''}">${av(S.me,56)}<b class="sm">You</b><small>${c.muted?'🔇 muted':c.mode==='video'&&!c.cam?'camera off':'connected'}</small></div>`;
  return me+c.parts.map(p=>{const live=now>=p.joinAt;return `<div class="pt ${live?'live':''} ${c.mode==='video'&&live?'vid':''}">${av(p,56)}<b class="sm">${esc(p.name.split(' ')[0])}</b><small>${live?(c.mode==='video'?'🎥 on camera':'🔊 connected'):'ringing…'}</small></div>`}).join('')}
function callView(){const c=S.call;return `<div class="call"><h2>${esc(c.title)}</h2><div class="ct" id="ctimer">${mmss((Date.now()-c.t0)/1000)}</div><div class="cg" id="cgrid">${partsHtml()}</div>
  <div class="cc"><button class="${c.muted?'on':''}" data-act="cmute">${c.muted?'🔇':'🎙️'}</button>${c.mode==='video'?`<button class="${c.cam?'':'on'}" data-act="ccam">${c.cam?'📹':'🚫'}</button>`:''}<button data-act="caddp">➕</button><button class="end" data-act="cend">📵</button></div></div>`}
let callTimer=null;
function startCall(mode){
  const ch=S.d.chat.ch;if(!feat('calls'))return toast('Calls are switched off by SemaChat right now.');
  if(mode==='video'&&!feat('videoCalls'))return toast('Video calls are switched off by SemaChat right now.');
  if(ch.members.length>2&&!feat('conference'))return toast('Group calls are switched off by SemaChat right now.');
  const t0=Date.now(),others=ch.members.filter(m=>m.id!==S.me.id);
  S.call={chatId:ch.id,mode,t0,muted:false,cam:mode==='video',title:ch.type==='group'?ch.name:'Calling '+ch.name,parts:others.map((p,i)=>Object.assign({},p,{joinAt:t0+1300+i*900}))};
  render();clearInterval(callTimer);callTimer=setInterval(()=>{const t=$('#ctimer');if(!t)return;t.textContent=mmss((Date.now()-S.call.t0)/1000);$('#cgrid').innerHTML=partsHtml()},1000);
}
async function endCall(){const c=S.call;clearInterval(callTimer);const dur=Math.floor((Date.now()-c.t0)/1000);S.call=null;
  await guard(async()=>{await api('POST','/api/chats/'+c.chatId+'/call',{mode:c.mode,dur});const t=cur();if(t&&t.n==='chat'&&S.d.chat){S.d.chat.msgs=await api('GET','/api/chats/'+c.chatId+'/messages')}});render()}

/* ---- tiny chart ---- */
function bars(vals,o){o=o||{};const h=o.h||110,mx=Math.max.apply(null,vals.concat([1]));
  return `<svg viewBox="0 0 ${vals.length*26} ${h+20}" class="chart" role="img">${vals.map((v,i)=>{const bh=Math.max(2,Math.round(v/mx*h));return `<rect x="${i*26+4}" y="${h-bh}" width="18" height="${bh}" rx="4" fill="${o.color||'#c2410c'}"><title>${o.labels?o.labels[i]+': ':''}${(o.fmt||(x=>x))(v)}</title></rect>${o.labels?`<text x="${i*26+13}" y="${h+14}" text-anchor="middle" font-size="9" fill="#7a7488">${o.labels[i]}</text>`:''}`}).join('')}</svg>`}

/* =============================== actions =============================== */
const acts={
  reset(){if(confirm('Reset all demo data and sign out?')){['semachat_db_v1','semachat_tok','semachat_atok'].forEach(k=>store.del(k));location.reload()}},
  retry(){S.blk=null;if(S.token&&!S.me){startSession().catch(e=>{if(e.status===401){S.token=null;store.del('semachat_tok')}else S.blk='SemaChat cannot be reached right now. You are still signed in.';render()})}else S.token?refresh():render()},
  tab(d){setTab(d.t)}, back(){back()}, off(){toast('This feature is switched off by SemaChat right now.')},
  go(d){go(d.p)}, closesheet(){S.sheet=null;render()},
  // auth
  async teamdemo(){try{const r=await api('POST','/api/auth/signin',{email:'amani@mail.com',code:'123ABC'});S.token=r.token;store.set('semachat_tok',r.token);await startSession()}catch(e){S.auth.err=e.message;render()}},
  authmode(d){S.auth=Object.assign(S.auth,{mode:d.m,step:1,err:'',code:''});render()},
  async otp(){const a=S.auth;a.err='';
    try{if(!a.email.trim())throw new Error('Enter your email address.');if(a.mode==='up'&&!a.name.trim())throw new Error('Enter your full name.');
      const r=await api('POST','/api/auth/otp',{email:a.email,purpose:a.mode==='up'?'signup':'signin'});a.hint=r.hint
      a.step=2;a.code=''}catch(e){a.err=e.message}render()},
  async authgo(){const a=S.auth;a.err='';
    try{let r;if(a.mode==='up')r=await api('POST','/api/auth/signup',{name:a.name,phone:a.phone,email:a.email,code:a.code,role:a.role});
      else r=await api('POST','/api/auth/signin',{email:a.email,code:a.code});
      S.token=r.token;store.set('semachat_tok',r.token);await startSession()}catch(e){a.err=e.message;render()}},
  signout(){try{api('POST','/api/auth/signout').catch(()=>{})}catch(e){}signOut()},
  // chats
  qf(d){S.cf=d.v;render()},
  openchat(d){go('chat',{id:d.id})}, msgto(d){guard(async()=>{const c=await api('POST','/api/chats',{type:'direct',members:[d.id]});S.stack=[];S.tab='chats';await go('chat',{id:c.id})})},
  sendtxt(){const i=$('#msgin'),t=i.value.trim();if(!t)return;i.value='';S.draft='';sendMsg('text',t)},
  attach(){S.sheet={n:'attach'};render()},
  att(d){const k=d.k;if(k==='photo'){S.sheet=null;render();$('#fPhoto').click()}else if(k==='video'){S.sheet=null;render();$('#fVideo').click()}else if(k==='file'){S.sheet=null;render();$('#fFile').click()}
    else if(k==='contact'){guard(async()=>{S.d.contacts=await api('GET','/api/contacts');S.sheet={n:'pickcontact'};render()})}
    else if(k==='music'){S.sheet={n:'music'};render()}
    else if(k==='loc'){S.sheet=null;render();shareLoc()}},
  async sendcontact(d){const c=S.d.contacts.find(x=>x.id===d.id);S.sheet=null;render();await sendMsg('contact','',{name:c.name,phone:c.phone})},
  async sendmusic(d){const t=[['Jambo Bwana (Acoustic)','Kilele Band',214],['Sauti za Busara','Zuri Ensemble',187],['Nairobi Nights','DJ Baraka',241],['Kilimanjaro Calling','Amani & The Rift',203],['Mama Africa','Uhuru Voices',226]][+d.i];S.sheet=null;render();await sendMsg('music','',{title:t[0],artist:t[1],dur:t[2]})},
  recstart(){S.rec=Date.now();$('#composer').innerHTML=composer();clearInterval(acts._rt);acts._rt=setInterval(()=>{const e=$('#rect');if(e)e.textContent=mmss((Date.now()-S.rec)/1000)},500)},
  recx(){clearInterval(acts._rt);S.rec=null;$('#composer').innerHTML=composer()},
  async recsend(){clearInterval(acts._rt);const dur=Math.max(1,Math.floor((Date.now()-S.rec)/1000));S.rec=null;$('#composer').innerHTML=composer();await sendMsg('voice','',{dur})},
  playv(d,el){el.textContent='⏸';setTimeout(()=>{el.textContent='▶'},2500)}, playm(d,el){el.textContent='⏸';setTimeout(()=>{el.textContent='▶'},3000)},
  savecontact(){toast('Contact saved to your address book')},
  call(d){startCall(d.m)},
  cmute(){S.call.muted=!S.call.muted;render()}, ccam(){S.call.cam=!S.call.cam;render()}, cend(){endCall()},
  caddp(){guard(async()=>{S.d.contacts=await api('GET','/api/contacts');S.sheet={n:'addparty'};render()})},
  addtocall(d){const c=S.d.contacts.find(x=>x.id===d.id);S.call.parts.push(Object.assign({},c,{joinAt:Date.now()+1200}));S.call.title='Conference • '+(S.call.parts.length+1)+' people';S.sheet=null;render()},
  newgroup(){guard(async()=>{S.d.contacts=await api('GET','/api/contacts');S.pick=[];S.gp.name='';S.sheet={n:'newgroup'};render()})},

function softRefresh(){clearTimeout(srT);srT=setTimeout(()=>{if(adminMode()||S.sheet||S.call||S.rec||!S.me||!S.token)return;const t=cur();
  if(t&&t.n!=='notifs')return;if(!t&&!['home','bhome','chats','orders'].includes(S.tab))return;guard(async()=>{await load();render()})},250)}
function banner(n){const w=$('#phoneWrap');if(!w||adminMode()||!S.me)return;const el=document.createElement('div');el.className='ban'+(n.urgent?' urgent':'');
  el.innerHTML=`<span style="font-size:22px">${NICON[n.type]||'🔔'}</span><div class="grow"><b class="sm">${esc(n.title)}</b><div class="sm ell">${esc(n.body)}</div></div><span class="chip" style="background:#fff3;color:#fff">Open</span>`;
  el.onclick=()=>{el.remove();openNotifObj(n)};w.appendChild(el);setTimeout(()=>el.remove(),5500)}
function onNotif(n){const t=cur(),d=n.delivery||{};softRefresh();
  if(d.held||d.silent||adminMode())return;                              // quiet hours / silent: badge only
  if(t&&t.n==='chat'&&n.ctx&&n.ctx.chatId===t.id)return;                // already looking at that chat
  banner(n)}
function onEvent(ev){
  if(ev.type==='message'){const t=cur();
    if(t&&t.n==='chat'&&S.d.chat&&t.id===ev.chatId){S.d.chat.msgs.push(ev.msg);paintMsgs();api('POST','/api/chats/'+ev.chatId+'/read').catch(()=>{})}
    else softRefresh();
  }else if(ev.type==='request'){toast('👋 '+ev.from.name+' sent you a friend request');if(S.me)S.me.requests++}
  else if(ev.type==='announce'){toast('📢 '+ev.text)}
  else if(ev.type==='notification'){onNotif(ev.n)}
  else if(ev.type==='mode:changed'){if(S.me&&ev.deviceId!==DEVICE&&ev.mode!==S.me.activeMode){toast('Your mode was changed to '+(ev.mode==='business'?'Business':'Normal')+' (support or another device)');S.stack=[];S.sheet=null;S.tab=ev.mode==='business'?'bhome':'home';guard(async()=>{await load();render()})}}
}

async function switchMode(m){
  if(S.me.activeMode===m)return;

  await afterSwitch();toast(r.activeMode==='business'?'🟢 Business mode':'🔵 Normal mode');
}

async function openNotifObj(n){

}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(el.tagName==='INPUT'&&el.type==='checkbox'&&!['pick'].includes(a)&&!a.startsWith('a_'))return;
  const fn=a.startsWith('a_')?adm[a.slice(2)]:acts[a];if(!fn)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox')return; // handled via change
  Promise.resolve(fn(el.dataset,el)).catch(err=>toast(err.message))});
document.addEventListener('change',e=>{const el=e.target;if(el.tagName==='INPUT'&&el.type==='checkbox'&&el.dataset.act){const a=el.dataset.act;const fn=a.startsWith('a_')?adm[a.slice(2)]:acts[a];if(fn)Promise.resolve(fn(el.dataset,el)).catch(err=>toast(err.message))}});
document.addEventListener('input',e=>{const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;if(/\.code$/.test(b)){const up=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,32);if(up!==el.value)el.value=up}setPath(b,el.value);if(el.dataset.live){const pos=el.selectionStart;render();const n=document.querySelector('[data-bind="'+b+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('change',e=>{const el=e.target,b=el.dataset&&el.dataset.bind;if(el.dataset&&el.dataset.onchg&&acts[el.dataset.onchg]){if(b)setPath(b,el.value);Promise.resolve(acts[el.dataset.onchg](el.dataset,el)).catch(err=>toast(err.message));return}if(b&&el.tagName==='SELECT'){setPath(b,el.value)}});

  <div class="pn"><h3>Broadcast to all users</h3><textarea rows="3" data-bind="bc" placeholder="e.g. SemaChat will be down for 10 minutes tonight at 11pm">${esc(S.bc)}</textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-act="a_bcast">Send broadcast</button>${s.announcement?`<button class="btn sm alt" data-act="a_bclear">Clear current</button>`:''}</div>${s.announcement?`<div class="hint" style="margin-top:8px">Live: ${esc(s.announcement.text)}</div>`:''}</div></div>`}
function aPartners(){const l=S.a.partners||[];return `<h2>Third-party partners</h2><p class="lead">Airlines, rail, coaches, taxis, hotels and restaurants listed under Me.</p><div class="pn"><table class="tbl"><tr><th>Partner</th><th>Category</th><th>Offers</th><th>Commission %</th><th>Listed</th></tr>${l.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.category}</td><td>${p.items}</td><td><div class="row"><input class="ns" type="number" data-bind="f.c_${p.id}" value="${S.f['c_'+p.id]!=null?S.f['c_'+p.id]:p.commission}"><button class="btn sm alt" data-act="a_pcomm" data-id="${p.id}">Save</button></div></td><td><label class="sw"><input type="checkbox" data-act="a_ptoggle" data-id="${p.id}" ${p.enabled?'checked':''}><span></span></label></td></tr>`).join('')}</table></div>`}
function aAudit(){return `<h2>Audit log</h2><p class="lead">Every developer action, newest first.</p><div class="pn">${(S.a.audit||[]).map(a=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--soft)"><span class="mut sm" style="width:120px">${dt(a.ts)} ${tm(a.ts)}</span><span>${esc(a.msg)}</span></div>`).join('')}</div>`}

/*@ADMIN-END*/

/* =============================== boot =============================== */
(async function boot(){
  // wait until every add-on script below has run, so no screen is drawn before its parts exist (this raced on fast servers)
  if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  if(!REMOTE){SemaChatCore.hooks.persist=DBsave}
  if(adminMode()){await adminBoot();return}
  // stay signed in until the person signs out: only a rejected token (401) ends the session, never being offline or a server restart
  if(S.token){try{await startSession()}catch(e){if(e.status===401){S.token=null;store.del('semachat_tok');render()}else{S.blk='SemaChat cannot be reached right now. You are still signed in.';render()}}}else render();
})();
</script>
