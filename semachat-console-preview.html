<style>
:root{--ink:#1f1b2e;--sand:#fbf6ee;--card:#fff;--brand:#c2410c;--brand2:#f59e0b;--green:#2f855a;--blue:#2b6cb0;--muted:#7a7488;--line:#eadfd0;--soft:#f4ebdd;--red:#c53030}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#2a2236;color:var(--ink);min-height:100vh;font-size:15px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:none}
h1,h2,h3{line-height:1.2}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#1b1626;color:#fff;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.top b{font-size:18px;letter-spacing:.3px}.top small{color:#b9afcf;font-size:12px}
.seg{display:flex;background:#2f2740;border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:9px;color:#cfc6e4;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--brand);color:#fff}
.sp{flex:1}
.link{color:#f0b27a;font-size:12.5px;text-decoration:underline}
#stage{display:flex;justify-content:center;padding:22px 12px}
.phone{width:410px;height:min(840px,calc(100vh - 100px));min-height:560px;background:var(--sand);border-radius:38px;box-shadow:0 0 0 10px #0e0b14,0 30px 70px #000a;overflow:hidden;position:relative}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}
.scr.fx{display:flex;flex-direction:column;overflow:hidden;padding:0}
@media(max-width:520px){#stage{padding:0}.phone{width:100vw;height:calc(100vh - 56px);border-radius:0;box-shadow:none}}
/* generic */
.pad{padding:14px 16px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}.mut{color:var(--muted);font-size:13px}.sm{font-size:12.5px}.b{font-weight:700}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--brand);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;text-align:center}
.btn.alt{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}.btn.gr{background:var(--green)}.btn.red{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn[disabled]{opacity:.5}
.btn.full{width:100%}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600;color:#5c4a33;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.badge{background:var(--brand);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:2px 7px;min-width:20px;text-align:center}
.tagb{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#e6f4ea;color:var(--green)}.tagb.o{background:#fdebd9;color:var(--brand)}.tagb.b{background:#e3eefb;color:var(--blue)}
.av{border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.vf.t-yellow{background:#eab308!important;color:#3b2f00!important}.vf.t-green{background:#16a34a!important}.vf.t-gold{background:linear-gradient(135deg,#f6d365,#c58a00)!important;color:#4a3200!important}
.vf{position:absolute;right:-3px;bottom:-3px;background:var(--blue);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;font-style:normal;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.ph{display:flex;align-items:center;gap:10px;padding:14px 12px 10px;background:var(--sand);position:sticky;top:0;z-index:5}
.ph h2{font-size:19px;flex:1}.ib{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 0 var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lh{font-size:22px;font-weight:800;padding:18px 16px 8px;display:flex;align-items:center;gap:8px}
.sec{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:14px 16px 6px}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px}.li:active{background:var(--soft)}
.sub3{display:flex;gap:6px;margin:0 16px 10px;background:var(--soft);padding:4px;border-radius:13px}
.sub3 button{flex:1;padding:8px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:#7b6747;position:relative}.sub3 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.empty{text-align:center;color:var(--muted);padding:34px 20px}.empty b{display:block;font-size:34px;margin-bottom:6px}
.err{color:var(--red);font-size:13.5px;font-weight:600}
/* nav */
.nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px 10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:5px 0;position:relative}
.nav button span{font-size:21px;filter:grayscale(1);opacity:.7}.nav button.on{color:var(--brand)}.nav button.on span{filter:none;opacity:1}
.nav .badge{position:absolute;top:0;left:56%}
/* auth */
.auth{padding:26px 24px;text-align:center;background:linear-gradient(180deg,#fff3e0,var(--sand) 40%)}
.auth .logo{font-size:56px;margin-top:10px}.auth h1{font-size:34px;color:var(--brand);letter-spacing:.5px}.auth .tag{color:var(--muted);margin:2px 0 18px;font-style:italic}
.auth form,.auth .fm{text-align:left;display:flex;flex-direction:column;gap:11px;margin-top:14px}
label.lb{font-size:12.5px;font-weight:700;color:#5c4a33;margin-bottom:-6px}
.hint{background:#fff8e1;border:1px dashed var(--brand2);border-radius:12px;padding:9px 12px;font-size:12.5px;color:#7a5200}
/* home */
.hero{padding:20px 18px 6px}.hero h1{font-size:26px}.hero p{color:var(--muted);margin-top:3px}
.ann{margin:10px 16px 0;background:linear-gradient(90deg,#1f1b2e,#44337a);color:#fff;border-radius:16px;padding:12px 14px;font-size:13.5px}.ann b{color:var(--brand2)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.wt{border-radius:22px;padding:15px;color:#fff;min-height:122px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.wt .e{font-size:30px}.wt h3{font-size:17px}.wt p{font-size:12.5px;opacity:.92}.wt .badge{position:absolute;top:12px;right:12px;background:#fff;color:var(--ink)}
.wt.off{filter:grayscale(1);opacity:.55}
.wt.wide{grid-column:span 2;min-height:0}
/* chat */
.msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#fbf6ee,#f6ecda)}

.bb{max-width:80%;padding:8px 11px 5px;border-radius:16px;font-size:14.5px;line-height:1.35;word-wrap:break-word}
.bb.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.bb.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px;box-shadow:0 1px 0 var(--line)}
.bt{font-size:10.5px;opacity:.7;text-align:right;margin-top:2px}.sn{font-size:12px;font-weight:800;margin-bottom:2px}
.vw{display:flex;align-items:center;gap:8px;min-width:190px}.vw .pl{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.them .vw .pl{background:var(--soft)}.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.7}
.pic{width:210px;height:150px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:58px;background-size:cover;background-position:center;position:relative;margin:2px 0 4px}
.pic .dur{position:absolute;right:8px;bottom:8px;background:#0008;color:#fff;font-size:11px;padding:2px 7px;border-radius:99px}
.pic .pp{position:absolute;width:44px;height:44px;border-radius:50%;background:#0007;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.fcard,.ccard,.mcard{display:flex;align-items:center;gap:10px;min-width:200px}.fi{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:20px}
.them .fi{background:var(--soft)}
.map{width:210px;height:110px;border-radius:12px;position:relative;background:#dfe9d6;background-image:linear-gradient(#cfdcc4 1px,transparent 1px),linear-gradient(90deg,#cfdcc4 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:4px;color:var(--ink)}
.callrow{display:flex;align-items:center;gap:8px;font-weight:600}
.comp{display:flex;align-items:center;gap:8px;padding:8px 10px 12px;background:#fff;border-top:1px solid var(--line)}
.comp input{border-radius:99px;padding:10px 14px}.comp .ib{background:var(--soft);box-shadow:none}.comp .send{background:var(--brand);color:#fff}
.recb{display:flex;align-items:center;gap:10px;padding:10px 12px 14px;background:#fff;border-top:1px solid var(--line)}.rd{width:12px;height:12px;border-radius:50%;background:var(--red);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
/* sheet */
.shade{position:absolute;inset:0;background:#0007;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sand);border-radius:24px 24px 0 0;padding:16px;z-index:21;max-height:82%;overflow-y:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin-bottom:12px;font-size:18px}.grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ag button{background:#fff;border-radius:16px;padding:14px 4px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 0 var(--line)}.ag span{font-size:28px}
/* feed */
.post{margin:0 16px 14px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.post .hd{display:flex;align-items:center;gap:10px;padding:12px}
.media{height:230px;display:flex;align-items:center;justify-content:center;font-size:84px;position:relative;color:#fff}
.media .dur{position:absolute;right:10px;bottom:10px;background:#0008;font-size:12px;padding:3px 9px;border-radius:99px}.media .pp{position:absolute;font-size:26px;background:#0006;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
const DEVICE='web-'+(store.get('semachat_dev')||(()=>{const d=Math.random().toString(36).slice(2,7);store.set('semachat_dev',d);return d})());
let es=null;
async function api(method,path,body,adm){
  const tok=adm?S.atok:S.token;
  if(REMOTE){
    const r=await fetch(window.SEMACHAT_API_BASE+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tok||''),'X-SemaChat-Device':DEVICE},body:body?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Request failed');e.status=r.status;e.code=j.code;throw e}return j;
  }
  await new Promise(r=>setTimeout(r,40));
  const r=SemaChatCore.handle(DB,method,path,body,tok,{'x-semachat-device':DEVICE,'x-client-ip':'preview'});DBsave();
  if(r.status>=400){const e=new Error(r.data.error);e.status=r.status;e.code=r.data.code;throw e}return r.data;
}
async function guard(fn){try{return await fn()}catch(e){if(!adminMode()&&(e.status===503||(e.status===403&&/suspended/i.test(e.message)))){S.blk=e.message;render()}else if(e.status===401&&!adminMode()&&S.token){signOut(true)}else toast(e.message)}}
const adminMode=()=>S.mode==='admin';
function connectEvents(){
  if(REMOTE){if(es)es.close();es=new EventSource('/api/stream?token='+encodeURIComponent(S.token));es.onmessage=e=>onEvent(JSON.parse(e.data))}
  else{SemaChatCore.hooks.emit=(uid,ev)=>{if(S.me&&uid===S.me.id)onEvent(ev)};SemaChatCore.hooks.persist=DBsave}
}

const NICON={chat:'💬',chat_biz:'💬',order:'📦',payment:'💰',review:'⭐',call:'📞',verification:'🪪',system:'📢',batch:'🗂️',ad:'📣',wallet:'👛'};
const deadline=ts=>{const m=Math.max(0,Math.round((ts-Date.now())/60000));return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'};
async function load(){
  const v=cur(),k=v?v.n:S.tab,F=m=>feat(m);
  const tryA=async(m,p)=>{try{return await api(m,p)}catch(e){return null}};
  S.me=await api('GET','/api/me');
  S.ws=await api('GET','/api/mode/widget-state');
  const nr=await tryA('GET','/api/notifications');if(nr)S.nu=nr.unread;
  if(k==='home'){if(F('planner'))S.d.planner=await tryA('GET','/api/planner')}
  else if(k==='bhome'){S.bz.dash=await api('GET','/api/biz/dashboard')}
  else if(k==='chats'||k==='chat'){if(F('chats')){
    if(k==='chats')S.d.chats=await api('GET','/api/chats?mode='+(S.cmode==='all'?'all':'auto')+(S.carch?'&archived=1':''));
    else{const all=await api('GET','/api/chats?mode=all');let ch=all.find(c=>c.id===v.id);if(!ch)ch=(await api('GET','/api/chats?mode=all&archived=1')).find(c=>c.id===v.id);
      S.d.chat={ch,msgs:await api('GET','/api/chats/'+v.id+'/messages')}}}}
  else if(k==='contacts'){S.d.contacts=await api('GET','/api/contacts');S.d.requests=await api('GET','/api/requests');
    if(S.cs==='ana'&&F('ana'))S.d.feed=await api('GET','/api/feed?scope='+S.scope)}
  else if(k==='explore'){if(F('explore'))S.d.explore=await api('GET','/api/explore?cat='+S.ex)}
  else if(k==='me'){S.disc=S.me.hasBizAccount?null:await tryA('GET','/api/mode/discovery')}
  else if(k==='wallet'){S.d.wallet=await api('GET','/api/wallet?mode='+S.wm);S.d.contacts=await api('GET','/api/contacts')}
  else if(k==='money'){S.d.wallet=await api('GET','/api/wallet?mode=business');S.bz.rev=await tryA('GET','/api/wallet/biz/revenue?days=14');S.d.contacts=await api('GET','/api/contacts')}
  else if(k==='orders'){S.bz.orders=await api('GET','/api/biz/orders')}
  else if(k==='bset'){S.bz.settings=await api('GET','/api/biz/settings');S.bz.team=await api('GET','/api/biz/team');S.d.contacts=await api('GET','/api/contacts')}
  else if(k==='notifs'){S.notifs=await api('GET','/api/notifications?mode='+S.nf);S.nu=S.notifs.unread}
  else if(k==='prefs'){S.pf=await api('GET','/api/me/preferences')}
  else if(k==='bizreg'){S.bz.status=await api('GET','/api/biz/status');if(!S.reg.welcome)S.reg.welcome=await api('GET','/api/biz/welcome');S.reg.conc=await tryA('GET','/api/biz/concierge-available');
    const b=S.bz.status.business;if(b&&S.bz.status.status==='rejected'&&!S.reg.touched)Object.assign(S.reg,{name:b.name,category:b.category,kind:b.kind,taxPin:b.taxPin||'',touched:true,step:1})}
  else if(k==='bizprev'){S.prev=await api('GET','/api/biz/preview?name='+encodeURIComponent(S.reg.name||''))}
  else if(k==='financial'){S.d.fin=await api('GET','/api/financial')}
  else if(k==='shop'){S.d.shop=await api('GET','/api/shop')}
  else if(k==='travel'){S.d.services=await api('GET','/api/services');S.d.bookings=await api('GET','/api/bookings')}
  else if(k==='plans'){S.d.plans=await api('GET','/api/plans');S.d.wallet=await api('GET','/api/wallet')}
  else if(k==='analytics'){S.d.an=await api('GET','/api/analytics')}
  else if(k==='planner'){S.d.planner=await api('GET','/api/planner')}
}
async function go(n,p){await guard(async()=>{S.stack.push(Object.assign({n},p||{}));await load();render()})}
async function back(){await guard(async()=>{S.stack.pop();await load();render()})}
async function setTab(t){await guard(async()=>{S.tab=t;S.stack=[];await load();render()})}
async function refresh(){await guard(async()=>{await load();render()})}

  const f=(l,k,t,ph)=>`<label class="lb">${l}</label><input type="${t||'text'}" data-bind="auth.${k}" value="${esc(a[k])}" placeholder="${ph||''}" ${k==='code'?'maxlength="32" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:6px;font-weight:800;font-size:20px;text-align:center"':''} ${a.step===2&&k!=='code'?'disabled':''}>`;
  let fields='';
  if(m==='up')fields=f('Full name','name','text','e.g. Amani Njoroge')+f('Email address (you will sign in with it)','email','email','you@example.com')+f('Phone number (optional)','phone','tel','0700 000 000')
    +`<label class="lb">Account type</label><select data-bind="auth.role" ${a.step===2?'disabled':''}><option value="user" ${a.role==='user'?'selected':''}>Personal</option><option value="corporate" ${a.role==='corporate'?'selected':''}>Corporate / Business</option><option value="institution" ${a.role==='institution'?'selected':''}>Institution</option></select>`;

  const go=a.step===1?`<button class="btn full" data-act="otp">Email me a verification code</button>`:`<button class="btn full" data-act="authgo">${m==='up'?'Verify email &amp; create my account':'Verify &amp; sign in'}</button><button class="btn alt full" data-act="authmode" data-m="${m}">Change details</button>`;
  return `<div class="scr auth"><div class="logo">🌍</div><h1>SemaChat</h1><p class="tag">I am because we are.</p>
  <div class="sub3" style="margin:0"><button class="${m==='in'?'on':''}" data-act="authmode" data-m="in">Sign in</button><button class="${m==='up'?'on':''}" data-act="authmode" data-m="up">Sign up</button></div>
  <div class="fm">${fields}${code}${a.err?`<div class="err">${esc(a.err)}</div>`:''}${go}${window.SC_PREVIEW&&m==='in'?'<button class="btn alt full" data-act="teamdemo">⚡ Development team: enter without signing in</button>':''}</div>

}

  return `<div class="shade" data-act="closesheet"></div><div class="sheet"><div class="grip"></div>${b}</div>`;
}

/* ---- call overlay ---- */
function partsHtml(){const c=S.call,now=Date.now();
  const me=`<div class="pt ${c.mode==='video'&&c.cam?'vid':''}">${av(S.me,56)}<b class="sm">You</b><small>${c.muted?'🔇 muted':c.mode==='video'&&!c.cam?'camera off':'connected'}</small></div>`;
  return me+c.parts.map(p=>{const live=now>=p.joinAt;return `<div class="pt ${live?'live':''} ${c.mode==='video'&&live?'vid':''}">${av(p,56)}<b class="sm">${esc(p.name.split(' ')[0])}</b><small>${live?(c.mode==='video'?'🎥 on camera':'🔊 connected'):'ringing…'}</small></div>`}).join('')}
function callView(){const c=S.call;return `<div class="call"><h2>${esc(c.title)}</h2><div class="ct" id="ctimer">${mmss((Date.now()-c.t0)/1000)}</div><div class="cg" id="cgrid">${partsHtml()}</div>
  <div class="cc"><button class="${c.muted?'on':''}" data-act="cmute">${c.muted?'🔇':'🎙️'}</button>${c.mode==='video'?`<button class="${c.cam?'':'on'}" data-act="ccam">${c.cam?'📹':'🚫'}</button>`:''}<button data-act="caddp">➕</button><button class="end" data-act="cend">📵</button></div></div>`}
let callTimer=null;
function startCall(mode){
  const ch=S.d.chat.ch;if(!feat('calls'))return toast('Calls are switched off by SemaChat right now.');
  if(mode==='video'&&!feat('videoCalls'))return toast('Video calls are switched off by SemaChat right now.');
  if(ch.members.length>2&&!feat('conference'))return toast('Group calls are switched off by SemaChat right now.');
  const t0=Date.now(),others=ch.members.filter(m=>m.id!==S.me.id);
  S.call={chatId:ch.id,mode,t0,muted:false,cam:mode==='video',title:ch.type==='group'?ch.name:'Calling '+ch.name,parts:others.map((p,i)=>Object.assign({},p,{joinAt:t0+1300+i*900}))};
  render();clearInterval(callTimer);callTimer=setInterval(()=>{const t=$('#ctimer');if(!t)return;t.textContent=mmss((Date.now()-S.call.t0)/1000);$('#cgrid').innerHTML=partsHtml()},1000);
}
async function endCall(){const c=S.call;clearInterval(callTimer);const dur=Math.floor((Date.now()-c.t0)/1000);S.call=null;
  await guard(async()=>{await api('POST','/api/chats/'+c.chatId+'/call',{mode:c.mode,dur});const t=cur();if(t&&t.n==='chat'&&S.d.chat){S.d.chat.msgs=await api('GET','/api/chats/'+c.chatId+'/messages')}});render()}

/* ---- tiny chart ---- */
function bars(vals,o){o=o||{};const h=o.h||110,mx=Math.max.apply(null,vals.concat([1]));
  return `<svg viewBox="0 0 ${vals.length*26} ${h+20}" class="chart" role="img">${vals.map((v,i)=>{const bh=Math.max(2,Math.round(v/mx*h));return `<rect x="${i*26+4}" y="${h-bh}" width="18" height="${bh}" rx="4" fill="${o.color||'#c2410c'}"><title>${o.labels?o.labels[i]+': ':''}${(o.fmt||(x=>x))(v)}</title></rect>${o.labels?`<text x="${i*26+13}" y="${h+14}" text-anchor="middle" font-size="9" fill="#7a7488">${o.labels[i]}</text>`:''}`}).join('')}</svg>`}

  if(d.held||d.silent||adminMode())return;                              // quiet hours / silent: badge only
  if(t&&t.n==='chat'&&n.ctx&&n.ctx.chatId===t.id)return;                // already looking at that chat
  banner(n)}
function onEvent(ev){
  if(ev.type==='message'){const t=cur();
    if(t&&t.n==='chat'&&S.d.chat&&t.id===ev.chatId){S.d.chat.msgs.push(ev.msg);paintMsgs();api('POST','/api/chats/'+ev.chatId+'/read').catch(()=>{})}
    else softRefresh();
  }else if(ev.type==='request'){toast('👋 '+ev.from.name+' sent you a friend request');if(S.me)S.me.requests++}
  else if(ev.type==='announce'){toast('📢 '+ev.text)}
  else if(ev.type==='notification'){onNotif(ev.n)}
  else if(ev.type==='mode:changed'){if(S.me&&ev.deviceId!==DEVICE&&ev.mode!==S.me.activeMode){toast('Your mode was changed to '+(ev.mode==='business'?'Business':'Normal')+' (support or another device)');S.stack=[];S.sheet=null;S.tab=ev.mode==='business'?'bhome':'home';guard(async()=>{await load();render()})}}
}

  const fn=a.startsWith('a_')?adm[a.slice(2)]:acts[a];if(!fn)return;

})();

  // motion-sensor step detection: smoothed acceleration magnitude, adaptive threshold, 250 ms refractory period

  async function camHr() {

      <div class="hbig" id="brT" style="margin-top:10px">${B ? '0.0' : '0'}<span style="font-size:20px"> s</span></div>
      <button class="hbtn ${B ? 'stop' : ''}" data-act="${B ? 'hlbrstop' : 'hlbrstart'}">${B ? 'Stop' : 'Start'}</button>
      <div class="row" style="margin-top:4px"><input data-bind="hl.f.bsec" type="number" placeholder="Or enter seconds you held" value="${esc(f.bsec || '')}"><button class="btn sm" data-act="hlbrmanual">Get report</button></div></div>
    ${r ? rep(r, `<b>${esc(r.label)}: ${r.seconds}s</b><div class="sm" style="margin-top:4px">Most likely: ${esc(r.likely)}.</div><ul>${r.advice.map(a => `<li>${esc(a)}</li>`).join('')}</ul><div class="hdis">${esc(r.disclaimer)}</div>`) : ''}
    <div class="sec">Typical results</div><div class="card" style="margin:0 16px 12px;font-size:12.5px">${[['Under 10 s', 'Very short: lung reserve may be reduced'], ['10–20 s', 'Below average'], ['20–30 s', 'Average'], ['30–45 s', 'Good'], ['45 s +', 'Excellent']].map(x => `<div class="row" style="margin:3px 0"><b style="width:76px">${x[0]}</b><span class="mut">${x[1]}</span></div>`).join('')}<div class="mut sm">Holds after breathing out are about half as long; the report adjusts for that and for age.</div></div>
    ${s.lastBreath ? `<div class="mut sm" style="padding:0 20px">Last check: ${s.lastBreath.seconds}s · ${ago(s.lastBreath.ts)} ago</div>` : ''}`;
  }

  /* ---- body ---- */
  function bodyTab(s) {
    const f = hl.f, r = hl.body;
    const inp = (k, l, t, ph) => `<div><label class="lb">${l}</label><input data-bind="hl.f.${k}" type="${t || 'number'}" placeholder="${ph || ''}" value="${esc(f[k])}"></div>`;
    return `<div class="hgrp"><div class="hrow2">${inp('w', 'Weight (kg)', 'number', 'e.g. 72')}${inp('h', 'Height (cm)', 'number', 'e.g. 175')}${inp('a', 'Age (years)', 'number', 'e.g. 31')}<div><label class="lb">Sex</label><select data-bind="hl.f.sex"><option value="m" ${f.sex === 'm' ? 'selected' : ''}>Male</option><option value="f" ${f.sex === 'f' ? 'selected' : ''}>Female</option></select></div></div>${inp('waist', 'Waist (cm), optional', 'number', 'around the navel')}<button class="btn full" style="margin-top:8px" data-act="hlassess">Analyse my body</button></div>
    ${r ? rep(r, `<b style="font-size:17px">${r.cleanBillOfHealth ? '✅ ' : ''}${esc(r.headline)}</b><div class="bmi"><i style="left:${Math.max(2, Math.min(98, (r.bmi - 14) / 28 * 100))}%"></i></div><div class="row mut sm"><span class="grow">14</span><span>18.5</span><span style="margin:0 20px">25</span><span>30</span><span style="margin-left:20px">40+</span></div>
      <div class="hgrid" style="padding:10px 0"><div><b>${r.bmi}</b><span>BMI</span></div><div><b>${r.healthyRangeKg[0]}–${r.healthyRangeKg[1]}</b><span>healthy kg</span></div><div><b>${r.dailyCalories}</b><span>kcal/day to maintain</span></div></div>
      ${r.risks.length ? `<b class="sm">Possible health dangers</b><ul>${r.risks.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="sm" style="color:var(--green)"><b>No weight-related risks found on these numbers.</b></div>'}<b class="sm">What to do</b><ul>${r.advice.map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="hdis">${esc(r.disclaimer)}</div>`) : '<div class="empty" style="padding:10px"><span class="sm">Enter your weight, height and age to see your obesity status, possible health dangers, or a clean bill of health.</span></div>'}`;
  }

  /* ---- more ---- */
  function moreTab(s) {
    const t = s.today, f = hl.f, m = hl.more;
    const wp = Math.min(100, Math.round(t.waterMl / t.waterGoalMl * 100));
    return `<div class="card" style="margin:0 16px 12px"><div class="row"><b class="grow">Daily health score</b><b style="font-size:24px;color:${s.score >= 75 ? 'var(--green)' : s.score >= 50 ? '#b7791f' : 'var(--red)'}">${s.score}</b></div>${s.scoreParts.map(p => `<div class="row sm" style="margin:6px 0"><span style="width:60px">${p[0]}</span><div class="hbar grow"><i style="width:${p[1]}%"></i></div></div>`).join('')}<div class="mut sm">Built from today’s steps, water, last night’s sleep and your weight status.</div></div>
    <div class="card" style="margin:0 16px 12px"><div class="row"><b class="grow">💧 Water</b><span class="mut sm">${t.waterMl} / ${t.waterGoalMl} ml</span></div><div class="hbar" style="margin:8px 0"><i style="width:${wp}%;background:#4299e1"></i></div><div class="row">${[200, 250, 500, 750].map(x => `<button class="btn alt sm grow" data-act="hlwater" data-v="${x}">+${x}</button>`).join('')}</div></div>
    <div class="card" style="margin:0 16px 12px"><b>😴 Sleep</b><div class="mut sm">${t.sleepHours ? 'Last night: ' + t.sleepHours + ' h' : 'Log last night’s sleep'}</div><div class="row" style="margin-top:6px"><input data-bind="hl.f.sleep" type="number" step="0.5" placeholder="Hours slept" value="${esc(f.sleep)}"><button class="btn sm" data-act="hlsleep">Log</button></div>${m && m.kind === 'sleep' ? `<div class="sm" style="margin-top:6px"><b>${esc(m.label)}.</b> ${esc(m.advice)}</div>` : ''}</div>
    <div class="card" style="margin:0 16px 12px"><b>🩸 Blood pressure</b><div class="mut sm">${s.lastBp ? 'Last: ' + s.lastBp.sys + '/' + s.lastBp.dia + ' mmHg' : 'Use a cuff, then log the numbers'}</div><div class="row" style="margin-top:6px"><input data-bind="hl.f.sys" type="number" placeholder="Top (sys)" value="${esc(f.sys)}"><input data-bind="hl.f.dia" type="number" placeholder="Bottom (dia)" value="${esc(f.dia)}"><button class="btn sm" data-act="hlbp">Check</button></div>${m && m.kind === 'bp' ? `<div class="hrep ${m.level}" style="margin:8px 0 0"><b>${esc(m.label)}</b><div class="sm">${esc(m.advice)}</div></div>` : ''}</div>
    <div class="card" style="margin:0 16px 12px;text-align:center"><b>🧘 Guided breathing</b><div class="mut sm">Slow breathing calms stress and lowers heart rate.</div><div class="breath" id="brth" style="transform:scale(${hl.breathing && hl.breathing.big ? 1.3 : 0.8})">${hl.breathing ? hl.breathing.label : 'Ready'}</div>${hl.breathing ? '<button class="btn alt" data-act="hlbreathstop">Stop</button>' : '<button class="btn" data-act="hlbreathe">Start (box breathing 4-4-4-4)</button>'}</div>
    <div class="card" style="margin:0 16px 12px"><b>🎯 Daily step goal</b><div class="row" style="margin-top:6px"><input data-bind="hl.f.goal" type="number" placeholder="${s.goalSteps}" value="${esc(f.goal || '')}"><button class="btn sm" data-act="hlgoal">Set</button></div></div>
    <div class="card" style="margin:0 16px 12px"><b>💡 Healthy habits</b><ul style="margin:6px 0 0 18px;font-size:13.5px"><li>Walk 30 minutes most days; add 2 strength sessions a week.</li><li>Fill half your plate with vegetables; keep sugary drinks rare.</li><li>Stand up and stretch every hour of sitting.</li><li>Aim for 7–9 hours of sleep and a fixed bedtime.</li><li>Get blood pressure and sugar checked yearly after 30.</li></ul></div>`;

  /* ------------------------------------------------------------ actions */
  const reloadSum = async () => { hl.sum = await tryA('GET', '/api/wellness') || hl.sum; render(); };
  Object.assign(acts, {
    hltab(d) { if (hl.hr && hl.hr.stop) { hl.hr.stop(); hl.hr = null; } hl.tab = d.v; render(); },
    hlstart(d) {
      if (hl.rec) return; const now = Date.now(), R = hl.rec = { mode: d.m, t0: now, steps: 0, cal: 0, dist: 0, spm: 0, win: [], segs: [], segT: now, segS: 0 };
      const go2 = () => { R.timer = setInterval(recTick, 1000); if (R.mode === 'sensor') startSensor(R); render(); };
      if (d.m === 'sensor') {

        else go2();

    hlstop() { return guard(stopRec); },
    hlmanual() { return guard(async () => { const st = +hl.f.steps, mi = +hl.f.mins; if (!(st > 0) || !(mi > 0)) return toast('Enter steps and minutes.'); const r = await api('POST', '/api/wellness/session', { steps: st, seconds: mi * 60, source: 'manual', note: 'Added by hand' }); hl.res = r.session; hl.sum = r.summary; hl.f.steps = hl.f.mins = ''; if (r.goalReached) toast('🎯 Daily step goal reached!'); render(); }); },

    hldemo() { return guard(() => saveHr(hl.f.state === 'rest' ? 66 + Math.round(Math.random() * 10) : 118 + Math.round(Math.random() * 20), 'demo')); },
    hlmanualhr() { return guard(() => saveHr(+hl.f.hrm, 'manual')); },
    hlkind(d) { hl.f.kind = d.v; render(); },
    hlbrstart() { hl.br = { t0: Date.now() }; hl.br.timer = setInterval(() => { const e = document.getElementById('brT'); if (e) e.innerHTML = ((Date.now() - hl.br.t0) / 1000).toFixed(1) + '<span style="font-size:20px"> s</span>'; }, 100); render(); },
    hlbrstop() { return guard(async () => { const sec = (Date.now() - hl.br.t0) / 1000; clearInterval(hl.br.timer); hl.br = null; hl.res3 = await api('POST', '/api/wellness/breath', { seconds: Math.max(1, Math.round(sec * 10) / 10), kind: hl.f.kind }); await reloadSum(); }); },
    hlbrmanual() { return guard(async () => { hl.res3 = await api('POST', '/api/wellness/breath', { seconds: +hl.f.bsec, kind: hl.f.kind }); await reloadSum(); }); },
    hlassess() { return guard(async () => { const f = hl.f; hl.body = await api('POST', '/api/wellness/assess', { weightKg: +f.w, heightCm: +f.h, age: +f.a, sex: f.sex, waistCm: f.waist ? +f.waist : undefined }); await reloadSum(); }); },
    hlwater(d) { return guard(async () => { hl.sum = await api('POST', '/api/wellness/water', { ml: +d.v }); render(); }); },
    hlsleep() { return guard(async () => { const r = await api('POST', '/api/wellness/sleep', { hours: +hl.f.sleep }); hl.more = Object.assign({ kind: 'sleep' }, r); hl.sum = r.summary; render(); }); },
    hlbp() { return guard(async () => { const r = await api('POST', '/api/wellness/bp', { sys: +hl.f.sys, dia: +hl.f.dia }); hl.more = Object.assign({ kind: 'bp' }, r); await reloadSum(); }); },
    hlgoal() { return guard(async () => { const p = hl.sum.profile || { weightKg: 70, heightCm: 170, age: 30, sex: 'm' }; hl.sum = await api('POST', '/api/wellness/profile', Object.assign({}, p, { goalSteps: +hl.f.goal })); toast('Goal updated'); render(); }); },
    hlbreathe() {
      const ph2 = ['Breathe in', 'Hold', 'Breathe out', 'Hold'], B = hl.breathing = { i: 0, big: false, label: ph2[0], n: 0 }; B.big = true;
      B.timer = setInterval(() => { B.i = (B.i + 1) % 4; B.n++; B.label = ph2[B.i]; B.big = B.i === 0 || B.i === 1; const e = document.getElementById('brth'); if (e) { e.textContent = B.label; e.style.transform = 'scale(' + (B.big ? 1.3 : 0.8) + ')'; } if (B.n >= 16) acts.hlbreathstop(); }, 4000); render();
    },
    hlbreathstop() { if (hl.breathing) { clearInterval(hl.breathing.timer); hl.breathing = null; toast('Nice work. Notice how calm you feel.'); render(); } }
  });
})();

    async dntake(d) { await api('POST', '/api/admin/donations/' + d.id + '/takedown', {}, true); await refresh('Taken down'); },

    async dirasave(d) { const a = S.a.dira.apps.find(x => x.id === d.id); await api('PUT', '/api/admin/dira/' + d.id, { scheme: S.f['dira_' + d.id + '_s'] != null ? S.f['dira_' + d.id + '_s'] : a.scheme, storeUrl: S.f['dira_' + d.id + '_u'] != null ? S.f['dira_' + d.id + '_u'] : a.storeUrl }, true); await refresh('Links saved'); },

<script>
/* SemaChat — real WebRTC calls (loaded via <!--EXT-->).
 * With the backend running, voice / video / group calls are real: the server relays offer/answer/ICE over the SSE
 * stream and audio + video travel peer-to-peer. In the standalone preview (no backend) the original simulated call
 * screen is kept, because there is nobody on the other end to connect to. */
(function () {
  'use strict';
  const live = () => typeof REMOTE !== 'undefined' && REMOTE && window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  let R = null, ring = null;          // R = active call, ring = incoming call prompt
  window.__rtc = () => R;
  const css = document.createElement('style');
  css.textContent = `#rtc,#rtcin{position:fixed;inset:0;z-index:350;max-width:520px;margin:0 auto;background:#14101f;color:#fff;display:flex;flex-direction:column}
  #rtc .tp{padding:16px;text-align:center}#rtc .tp h2{font-size:18px}#rtc .tm{opacity:.8;font-variant-numeric:tabular-nums}
  #rtc .grid{flex:1;display:grid;gap:8px;padding:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-content:center}
  #rtc .tile{position:relative;background:#2a2340;border-radius:16px;overflow:hidden;min-height:150px;display:flex;align-items:center;justify-content:center}
  #rtc .tile video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#000}#rtc .tile.noV video{display:none}
  #rtc .tile .nm{position:absolute;left:8px;bottom:6px;font-size:12px;background:#0008;border-radius:99px;padding:2px 8px;z-index:2}
  #rtc .tile.me{outline:2px solid #ffffff33}#rtc .cc{display:flex;gap:14px;justify-content:center;padding:16px 16px 28px}
  #rtc .cc button,#rtcin .cc button{width:58px;height:58px;border-radius:50%;background:#ffffff22;color:#fff;font-size:24px}#rtc .cc .on{background:#fff;color:#14101f}#rtc .cc .end,#rtcin .no{background:#e53e3e}#rtcin .yes{background:#38a169}
  #rtcin{justify-content:center;align-items:center;text-align:center;gap:10px}#rtcin .cc{display:flex;gap:40px;margin-top:30px}`;
  document.head.appendChild(css);
  const post = (p, b) => api('POST', p, b || {});
  const ago = () => { const s = Math.floor((Date.now() - R.t0) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  function ui() {
    if (!R) return; let el = document.getElementById('rtc'); if (!el) { el = document.createElement('div'); el.id = 'rtc'; document.body.appendChild(el); }
    const tiles = [`<div class="tile me ${R.mode === 'video' && R.cam ? '' : 'noV'}" id="t_me"><video autoplay playsinline muted></video><span style="font-size:40px">🙂</span><span class="nm">You${R.muted ? ' · 🔇' : ''}</span></div>`]
      .concat(Object.keys(R.peers).map(id => `<div class="tile ${R.mode === 'video' ? '' : 'noV'}" id="t_${id}"><video autoplay playsinline></video><span style="font-size:40px">🙂</span><span class="nm">${esc(R.peers[id].name)} · ${R.peers[id].state}</span></div>`));
    el.innerHTML = `<div class="tp"><h2>${esc(R.title)}</h2><div class="tm" id="rtcT">${R.waiting ? 'Ringing…' : ago()}</div></div><div class="grid">${tiles.join('')}</div>
      <div class="cc"><button class="${R.muted ? 'on' : ''}" data-rt="mute">${R.muted ? '🔇' : '🎙️'}</button>${R.mode === 'video' ? `<button class="${R.cam ? '' : 'on'}" data-rt="cam">${R.cam ? '📹' : '🚫'}</button>` : ''}<button class="end" data-rt="end">📵</button></div>`;
    const me = el.querySelector('#t_me video'); if (me && R.local) me.srcObject = R.local;
    Object.keys(R.peers).forEach(id => { const v = el.querySelector('#t_' + id + ' video'); if (v && R.peers[id].stream) v.srcObject = R.peers[id].stream; });
  }
  async function media(mode) {
    try { return await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' }); }
    catch (e) { if (mode === 'video') { try { toast('Camera unavailable: continuing with voice only.'); return await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e2) { /* fall through */ } } throw new Error('Allow microphone access to make calls.'); }
  }
  function peer(id, name, initiator) {
    if (R.peers[id]) return R.peers[id];
    const pc = new RTCPeerConnection({ iceServers: R.ice }), P = R.peers[id] = { pc, name: name || 'Friend', state: 'connecting…', stream: null, queue: [] };
    R.local.getTracks().forEach(t => pc.addTrack(t, R.local));
    pc.onicecandidate = e => { if (e.candidate && R) post('/api/calls/' + R.id + '/signal', { to: id, kind: 'ice', data: e.candidate.toJSON() }).catch(() => { }); };
    pc.ontrack = e => { P.stream = e.streams[0]; ui(); };
    pc.onconnectionstatechange = () => { P.state = pc.connectionState === 'connected' ? 'connected' : pc.connectionState === 'failed' ? 'connection failed' : 'connecting…'; if (pc.connectionState === 'connected') R.waiting = false; ui(); };
    if (initiator) pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => post('/api/calls/' + R.id + '/signal', { to: id, kind: 'offer', data: pc.localDescription.toJSON() })).catch(e => toast(e.message));
    ui(); return P;
  }
  const drop = id => { const P = R && R.peers[id]; if (P) { try { P.pc.close(); } catch (e) { /* closed */ } delete R.peers[id]; ui(); } };
  function cleanup(msg) {
    if (!R) return; clearInterval(R.timer); Object.keys(R.peers).forEach(id => { try { R.peers[id].pc.close(); } catch (e) { /* closed */ } }); R.local && R.local.getTracks().forEach(t => t.stop());
    const el = document.getElementById('rtc'); if (el) el.remove(); const chatId = R.chatId; R = null; if (msg) toast(msg);
    const t = cur(); if (t && t.n === 'chat' && S.d.chat && S.d.chat.ch.id === chatId) api('GET', '/api/chats/' + chatId + '/messages').then(m => { S.d.chat.msgs = m; render(); }).catch(() => { }); else softRefresh && softRefresh();
  }
  function begin(o) {
    R = Object.assign({ peers: {}, muted: false, cam: o.mode === 'video', t0: Date.now(), waiting: false }, o);
    R.timer = setInterval(() => { const e = document.getElementById('rtcT'); if (e && !R.waiting) e.textContent = ago(); }, 1000); ui();
  }
  async function realStart(mode) {
    const ch = S.d.chat.ch;
    try {
      const local = await media(mode), r = await post('/api/calls', { chatId: ch.id, mode });
      begin({ id: r.id, chatId: ch.id, mode, ice: r.iceServers, local, title: ch.type === 'group' ? ch.name : 'Calling ' + ch.name, waiting: true, users: {} }); r.members.forEach(m => { R.users[m.id] = m; });
    } catch (e) { toast(e.message); }
  }
  const _start = window.startCall;
  window.startCall = function (mode) {
    const ch = S.d.chat && S.d.chat.ch; if (!ch || !live()) return _start(mode);
    if (!feat('calls')) return toast('Calls are switched off by SemaChat right now.');
    if (mode === 'video' && !feat('videoCalls')) return toast('Video calls are switched off by SemaChat right now.');
    if (ch.members.length > 2 && !feat('conference')) return toast('Group calls are switched off by SemaChat right now.');
    if (R) return toast('You are already in a call.'); realStart(mode);
  };
  async function accept() {
    const c = ring; stopRing(); if (!c || R) return;
    try {
      const local = await media(c.mode), r = await post('/api/calls/' + c.id + '/join');
      begin({ id: c.id, chatId: c.chatId, mode: c.mode, ice: r.iceServers, local, title: c.title, users: {} });
      r.participants.forEach(p => { R.users[p.id] = p; peer(p.id, p.name, true); });
    } catch (e) { toast(e.message); post('/api/calls/' + c.id + '/decline').catch(() => { }); }
  }
  function stopRing() { clearTimeout(stopRing.t); const el = document.getElementById('rtcin'); if (el) el.remove(); const c = ring; ring = null; return c; }
  function incoming(c) {
    if (R || ring) { post('/api/calls/' + c.id + '/decline').catch(() => { }); return; }
    ring = c; const el = document.createElement('div'); el.id = 'rtcin';
    el.innerHTML = `<div style="font-size:64px">📞</div><h2>${esc(c.from.name)}</h2><div style="opacity:.8">${c.group ? 'Group ' : ''}${c.mode === 'video' ? 'video' : 'voice'} call · ${esc(c.title)}</div><div class="cc"><button class="no" data-rt="decline">📵</button><button class="yes" data-rt="accept">📞</button></div>`;
    document.body.appendChild(el); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { /* no vibration */ }
    stopRing.t = setTimeout(stopRing, 58000);
  }
  async function signal(ev) {
    if (ring && ring.id === ev.id && ['ended', 'missed', 'declined'].includes(ev.kind)) { stopRing(); return toast('Missed call'); }
    if (!R || R.id !== ev.id) return;
    const from = ev.from, d = ev.data || {};
    if (ev.kind === 'joined') { R.users[from] = d.user; R.waiting = false; const P = peer(from, d.user && d.user.name, false); P.name = (d.user && d.user.name) || P.name; ui(); }
    else if (ev.kind === 'offer') {
      const P = peer(from, (R.users[from] || {}).name, false);
      await P.pc.setRemoteDescription(d); P.queue.splice(0).forEach(c => P.pc.addIceCandidate(c).catch(() => { }));
      const a = await P.pc.createAnswer(); await P.pc.setLocalDescription(a); post('/api/calls/' + R.id + '/signal', { to: from, kind: 'answer', data: P.pc.localDescription.toJSON() }).catch(() => { });
    } else if (ev.kind === 'answer') { const P = R.peers[from]; if (P) { await P.pc.setRemoteDescription(d); P.queue.splice(0).forEach(c => P.pc.addIceCandidate(c).catch(() => { })); } }
    else if (ev.kind === 'ice') { const P = R.peers[from]; if (P) { if (P.pc.remoteDescription) P.pc.addIceCandidate(d).catch(() => { }); else P.queue.push(d); } }
    else if (ev.kind === 'left') drop(from);
    else if (ev.kind === 'declined') { toast(((R.users[from] || {}).name || 'They') + ' declined.'); }
    else if (ev.kind === 'ended') cleanup('Call ended'); else if (ev.kind === 'missed') cleanup('No answer');
  }
  const _ev = window.onEvent;
  window.onEvent = function (ev) { if (ev.type === 'call_incoming') return incoming(ev.call); if (ev.type === 'call_signal') return signal(ev).catch(e => console.warn('[call]', e.message)); return _ev(ev); };
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-rt]'); if (!b) return; const a = b.dataset.rt;
    if (a === 'accept') accept(); else if (a === 'decline') { const c = stopRing(); if (c) post('/api/calls/' + c.id + '/decline').catch(() => { }); }
    else if (a === 'mute' && R) { R.muted = !R.muted; R.local.getAudioTracks().forEach(t => t.enabled = !R.muted); ui(); }
    else if (a === 'cam' && R) { R.cam = !R.cam; R.local.getVideoTracks().forEach(t => t.enabled = R.cam); ui(); }
    else if (a === 'end' && R) { const id = R.id; post('/api/calls/' + id + '/leave').catch(() => { }); cleanup(); }
  });
})();

</script>

<script>
/* SemaChat — Content guard UI: "Not delivered" marker in the sender's chat, and the developer's Content guard section. */
(function () {
  'use strict';
  const css = document.createElement('style');
  css.textContent = `.nd{opacity:.82}.nd .nn{display:flex;gap:6px;align-items:center;justify-content:flex-end;color:#c53030;font-size:11.5px;font-weight:700;margin:2px 10px 8px}.nd .nn i{font-style:normal}
  .gtag{display:inline-block;padding:2px 8px;border-radius:99px;background:#fff5f5;color:#c53030;font-size:11px;font-weight:800}`;
  document.head.appendChild(css);
  // chat: the sender sees their message, marked as not delivered (no network involved, so a strong signal does not help)
  const _bubble = window.bubble;
  if (_bubble) window.bubble = function (m, ch) {
    const h = _bubble(m, ch); if (!m.blocked) return h;
    return `<div class="nd">${h}<div class="nn"><i>⚠️</i>Not delivered · contains content SemaChat does not allow</div></div>`;
  };

  /* ---------------------------------------------------------------- developer console */
  const _load = window.adminLoadExt;
  window.adminLoadExt = async function (s, A) { if (_load) await _load(s, A); if (s === 'guard') A.guard = await api('GET', '/api/admin/guard', null, true); };
  const tm = ts => new Date(ts).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const catName = (g, id) => ((g.categories.find(c => c.id === id) || {}).name) || id;
  window.aGuard = function () {
    const g = S.a.guard; if (!g) return '<h2>Content guard</h2>';
    const F = S.f, sel = (k, opts, v) => `<select data-bind="f.${k}">${opts.map(o => `<option value="${o[0]}" ${(F[k] || v) === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
    const cats = g.categories.map(c => [c.id, c.name]), types = [['word', 'Word'], ['slang', 'Slang'], ['phrase', 'Phrase'], ['location', 'Place name']];
    return `<h2>Content guard</h2><p class="lead">Words, slang, phrases, place names and restricted zones that must not travel on SemaChat, for the safety and unity of the country. A match is stopped before delivery: in chat the <b>sender still sees the message, marked “Not delivered”</b>, and nobody else ever receives it, whatever the network. Posts, comments, captions and adverts are refused with a clear message. Senders are never told which word matched.</p>
    <div class="row" style="margin-bottom:10px"><label class="sw"><input type="checkbox" data-act="a_guardsw" ${g.enabled ? 'checked' : ''}><span></span></label><b>${g.enabled ? 'Guard is ON' : 'Guard is OFF: nothing is being stopped'}</b></div>
    <div class="grid"><div class="gk"><span>Blocked in last 24 h</span><b>${g.stats.blocked24h}</b></div><div class="gk"><span>Blocked in total</span><b>${g.stats.blockedTotal}</b></div><div class="gk"><span>Active terms</span><b>${g.stats.activeRules}</b></div><div class="gk"><span>Restricted zones</span><b>${g.stats.zones}</b></div></div>
    <div class="pn"><h3>Add a word, slang, phrase or place</h3><div class="row" style="flex-wrap:wrap;gap:8px"><input data-bind="f.gTerm" placeholder="e.g. a phrase to stop" value="${esc(F.gTerm || '')}" style="min-width:220px">${sel('gType', types, 'word')}${sel('gCat', cats, 'incitement')}${sel('gMatch', [['word', 'Whole word / phrase'], ['contains', 'Anywhere inside words']], 'word')}<button class="btn sm" data-act="a_guardadd">Add</button></div>
      <details style="margin-top:10px"><summary class="sm"><b>Add many at once</b></summary><textarea data-bind="f.gBulk" rows="4" placeholder="One per line (or separated by commas)" style="width:100%;margin:8px 0">${esc(F.gBulk || '')}</textarea><button class="btn sm alt" data-act="a_guardbulk">Add all (uses the type and category above)</button></details>
      <div class="sm mut" style="margin-top:8px">Matching ignores capitals, accents, punctuation, number-for-letter swaps (0/o, 1/i, 3/e, 4/a, 5/s, @/a) and spaced-out letters. It is a word list, not an AI: review hits regularly.</div></div>
    <div class="pn"><h3>Try a sentence</h3><div class="row"><input data-bind="f.gTest" placeholder="Type a sentence to see if it would be stopped" value="${esc(F.gTest || '')}"><button class="btn sm" data-act="a_guardtest">Test</button></div>${F.gTestRes ? `<div class="sm" style="margin-top:8px">${F.gTestRes.blocked ? '🚫 Would be stopped: ' + F.gTestRes.matched.map(m => `<span class="gtag">${esc(m.term)} · ${esc(catName(g, m.category))}</span>`).join(' ') : '✅ Would be delivered'}</div>` : ''}</div>
    <div class="pn"><h3>The list (${g.rules.length})</h3><table class="tbl"><tr><th>Term</th><th>Type</th><th>Category</th><th>Matches</th><th>Hits</th><th>On</th><th></th></tr>${g.rules.map(r => `<tr><td><b>${esc(r.term)}</b>${r.example ? ' <span class="mut sm">(starter example)</span>' : ''}</td><td>${esc(r.type)}</td><td class="sm">${esc(catName(g, r.category))}</td><td class="sm">${r.match === 'contains' ? 'anywhere' : 'whole word'}</td><td>${r.hits}</td><td><label class="sw"><input type="checkbox" data-act="a_guardrule" data-id="${r.id}" ${r.enabled ? 'checked' : ''}><span></span></label></td><td><button class="btn sm alt" data-act="a_guardrm" data-id="${r.id}">Remove</button></td></tr>`).join('') || '<tr><td colspan="7" class="mut">Nothing on the list yet.</td></tr>'}</table></div>
    <div class="pn"><h3>Restricted zones</h3><p class="mut sm">Messages, location shares and adverts with a pin inside a zone are stopped.</p><div class="row" style="flex-wrap:wrap;gap:8px"><input data-bind="f.zName" placeholder="Zone name" value="${esc(F.zName || '')}"><input data-bind="f.zLat" type="number" step="any" placeholder="Latitude" value="${esc(F.zLat || '')}" style="width:120px"><input data-bind="f.zLng" type="number" step="any" placeholder="Longitude" value="${esc(F.zLng || '')}" style="width:120px"><input data-bind="f.zRad" type="number" placeholder="Radius (m)" value="${esc(F.zRad || '')}" style="width:110px"><button class="btn sm" data-act="a_guardzone">Add zone</button></div>
      ${g.zones.length ? `<table class="tbl" style="margin-top:8px"><tr><th>Zone</th><th>Centre</th><th>Radius</th><th>Hits</th><th>On</th><th></th></tr>${g.zones.map(z => `<tr><td><b>${esc(z.name)}</b></td><td class="sm">${z.lat.toFixed(4)}, ${z.lng.toFixed(4)}</td><td>${z.radiusM.toLocaleString('en-KE')} m</td><td>${z.hits}</td><td><label class="sw"><input type="checkbox" data-act="a_guardzsw" data-id="${z.id}" ${z.enabled ? 'checked' : ''}><span></span></label></td><td><button class="btn sm alt" data-act="a_guardzrm" data-id="${z.id}">Remove</button></td></tr>`).join('')}</table>` : ''}</div>
    <div class="pn"><h3>Recent stops</h3>${g.repeat.length ? `<div class="sm" style="margin-bottom:8px"><b>Most stops:</b> ${g.repeat.map(r => esc(r.user ? r.user.name : '?') + ' (' + r.hits + ')').join(' · ')}</div>` : ''}<table class="tbl"><tr><th>When</th><th>Who</th><th>Where</th><th>Category</th><th>Excerpt</th></tr>${g.hits.map(h => `<tr><td class="sm">${tm(h.ts)}</td><td>${esc(h.user ? h.user.name : '?')}</td><td class="sm"><code>${esc(h.where)}</code></td><td><span class="gtag">${esc(catName(g, h.category))}</span></td><td class="sm">${esc(h.excerpt)}</td></tr>`).join('') || '<tr><td colspan="5" class="mut">Nothing has been stopped yet.</td></tr>'}</table><p class="mut sm">Opening this list is recorded in the Access audit because it shows what people wrote.</p></div>`;
  };
  const refresh = async m => { if (m) toast(m); await adminBoot(); };
  Object.assign(adm, {
    async guardsw(d, el) { await api('PUT', '/api/admin/guard/settings', { enabled: el.checked }, true); await refresh(el.checked ? 'Content guard ON' : 'Content guard OFF'); },
    async guardadd() { const F = S.f; await api('POST', '/api/admin/guard/rules', { term: F.gTerm, type: F.gType || 'word', category: F.gCat || 'incitement', match: F.gMatch || 'word' }, true); F.gTerm = ''; await refresh('Added to the list'); },
    async guardbulk() { const F = S.f, r = await api('POST', '/api/admin/guard/bulk', { text: F.gBulk, type: F.gType || 'word', category: F.gCat || 'incitement', match: F.gMatch || 'word' }, true); F.gBulk = ''; await refresh(r.added + ' added, ' + r.skipped + ' skipped'); },
    async guardtest() { S.f.gTestRes = await api('POST', '/api/admin/guard/test', { text: S.f.gTest }, true); render(); },
    async guardrule(d, el) { await api('PUT', '/api/admin/guard/rules/' + d.id, { enabled: el.checked }, true); await refresh(); },
    async guardrm(d) { if (!confirm('Remove this term from the list?')) return; await api('DELETE', '/api/admin/guard/rules/' + d.id, null, true); await refresh('Removed'); },
    async guardzone() { const F = S.f; await api('POST', '/api/admin/guard/zones', { name: F.zName, lat: F.zLat, lng: F.zLng, radiusM: F.zRad }, true); Object.assign(F, { zName: '', zLat: '', zLng: '', zRad: '' }); await refresh('Zone added'); },
    async guardzsw(d, el) { await api('PUT', '/api/admin/guard/zones/' + d.id, { enabled: el.checked }, true); await refresh(); },
    async guardzrm(d) { if (!confirm('Remove this zone?')) return; await api('DELETE', '/api/admin/guard/zones/' + d.id, null, true); await refresh('Zone removed'); }
  });
})();

</script>

</body>
</html>
